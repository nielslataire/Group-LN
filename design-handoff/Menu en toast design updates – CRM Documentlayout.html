<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Bundled Page...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"a731eb05-1d00-4858-a1b1-d0a327648064\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet><meta name=\"design_doc_mode\" content=\"canvas\"><link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\"><link href=\"https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;450;500;600;700&amp;display=swap\" rel=\"stylesheet\"><style>body{margin:0;background:#D9DED5;font-family:'IBM Plex Sans',sans-serif}a{color:#00532D}a:hover{color:#B8935A}<\u002Fstyle><\u002Fhelmet>\n<section id=\"t36\" style=\"padding:40px 44px 20px;display:flex;flex-direction:column;gap:20px\">\n<div style=\"display:flex;align-items:baseline;gap:10px\"><a href=\"#t36\" style=\"font:600 10px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;padding:3px 7px;background:#00532D;color:#fff;border-radius:4px;text-decoration:none\">36<\u002Fa><span style=\"font:600 13px/1.3 'IBM Plex Sans',sans-serif;color:#00532D\">Opmaakspecificaties — lettertypes, groottes, kleuren, maten en opbouw per document (<a href=\"#35a\">35a<\u002Fa>–<a href=\"#35h\">35h<\u002Fa>)<\u002Fspan><\u002Fdiv>\n<div id=\"36a\" style=\"width:1500px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px\">\n<div style=\"grid-column:span 1;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 18px 40px -30px rgba(31,42,30,.45);padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0\"><div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:600 15px 'IBM Plex Sans',sans-serif;color:#1F2A1E\">1 · Lettertypes<\u002Fspan><span style=\"font:400 12px/1.45 'IBM Plex Sans',sans-serif;color:#56664F\">Twee families, niet meer.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:1fr 1fr;g ing:7px 0;border-bottom:1px solid rgba(31,42,30,.12)\"><span style=\"min-width:0\"><a href=\"#35f\" style=\"font:600 11px 'IBM Plex Sans',sans-serif;padding:2px 6px;background:rgba(0,0,0,.07);border-radius:4px;text-decoration:none\">35f<\u002Fa><\u002Fspan><span style=\"min-width:0\"><b>Aannemerslijst<\u002Fb><\u002Fspan><span style=\"min-width:0\">A4 liggend<\u002Fspan><span style=\"min-width:0\">Compacte kop · projectfiche (4 kol.) · tabel per deel met checklistkolommen · legenda · voet<\u002Fspan><span style=\"min-width:0\">Kolommen 30 · 46 · 38 · 1fr · 5 × 15 mm. Tabelkop wit op groen, herhaalt per pagina.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:56px 150px 100px minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(31,42,30,.12)\"><span style=\"min-width:0\"><a href=\"#35g\" style=\"font:600 11px 'IBM Plex Sans',sans-serif;padding:2px 6px;background:rgba(0,0,0,.07);border-radius:4px;text-decoration:none\">35g<\u002Fa><\u002Fspan><span style=\"min-width:0\"><b>Prijslijst eenheden<\u002Fb><\u002Fspan><span style=\"min-width:0\">A3 staand<\u002Fspan><span style=\"min-width:0\">Kop · plan (120 mm) + kerncijfers · tabel eenheden · voet<\u002Fspan><span style=\"min-width:0\">Kerncijfers 16 pt in 2 kolommen naast het plan.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:56px 150px 100px minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(31,42,30,.12)\"><span style=\"min-width:0\"><a href=\"#35h\" style=\"font:600 11px 'IBM Plex Sans',sans-serif;padding:2px 6px;background:rgba(0,0,0,.07);border-radius:4px;text-decoration:none\">35h<\u002Fa><\u002Fspan><span style=\"min-width:0\"><b>Budget<\u002Fb><\u002Fspan><span style=\"min-width:0\">A3 liggend<\u002Fspan><span style=\"min-width:0\">Compacte kop + kerncijfers rechts · tabel loten met subtotaal en verbruiksbalk · totaalrij · voet<\u002Fspan><span style=\"min-width:0\">Kolommen 18 · 1fr · 14 · 18 · 24 · 4 × 28 · 34 mm.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column:span 2;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 18px 40px -30px rgba(31,42,30,.45);padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0\"><div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:600 15px 'IBM Plex Sans',sans-serif;color:#1F2A1E\">7 · Regels<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px\"><div style=\"display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid rgba(31,42,30,.12);border-radius:8px\"><b style=\"font:600 12.5px 'IBM Plex Sans',sans-serif;color:#1F2A1E\">Meerdere pagina's<\u002Fb><span style=\"font:400 12px/1.5 'IBM Plex Sans',sans-serif;color:#56664F;text-wrap:pretty\">Tabelkop herhaalt. Rij nooit splitsen. Totalen, btw en betaling enkel op de laatste pagina. Voet toont \"x / y\".<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid rgba(31,42,30,.12);border-radius:8px\"><b style=\"font:600 12.5px 'IBM Plex Sans',sans-serif;color:#1F2A1E\">Bedragen<\u002Fb><span style=\"font:400 12px/1.5 'IBM Plex Sans',sans-serif;color:#56664F;text-wrap:pretty\">€ + spatie + bedrag: € 1.149,60 · punt voor duizendtallen, komma voor decimalen · negatief: – € 640,00.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid rgba(31,42,30,.12);border-radius:8px\"><b style=\"font:600 12.5px 'IBM Plex Sans',sans-serif;color:#1F2A1E\">Data en nummers<\u002Fb><span style=\"font:400 12px/1.5 'IBM Plex Sans',sans-serif;color:#56664F;text-wrap:pretty\">dd/mm/jjjj · factuurnr. 0016.09.2026 · btw-nr. BE 0464.670.778 · IBAN in groepen van 4.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid rgba(31,42,30,.12);border-radius:8px\"><b style=\"font:600 12.5px 'IBM Plex Sans',sans-serif;color:#1F2A1E\">Btw<\u002Fb><span style=\"font:400 12px/1.5 'IBM Plex Sans',sans-serif;color:#56664F;text-wrap:pretty\">Schrijf \"6 %\" met spatie. Elk gebruikt tarief krijgt een eigen rij in het btw-overzicht én een wettelijke vermelding als het geen 21 % is.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid rgba(31,42,30,.12);border-radius:8px\"><b style=\"font:600 12.5px 'IBM Plex Sans',sans-serif;color:#1F2A1E\">Uitlijning<\u002Fb><span style=\"font:400 12px/1.5 'IBM Plex Sans',sans-serif;color:#56664F;text-wrap:pretty\">Tekst links, cijfers rechts. Kolombreedtes vast in mm, omschrijving neemt de rest.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid rgba(31,42,30,.12);border-radius:8px\"><b style=\"font:600 12.5px 'IBM Plex Sans',sans-serif;color:#1F2A1E\">Lege ruimte<\u002Fb><span style=\"font:400 12px/1.5 'IBM Plex Sans',sans-serif;color:#56664F;text-wrap:pretty\">Tabel groeit naar beneden; het onderste blok (totaal, betaling) staat altijd tegen de voet.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column:span 2;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 18px 40px -30px rgba(31,42,30,.45);padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0\"><div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:600 15px 'IBM Plex Sans',sans-serif;color:#1F2A1E\">8 · Bouwen in QuestPDF<\u002Fspan><span style=\"font:400 12px/1.45 'IBM Plex Sans',sans-serif;color:#56664F\">Vertaling van de specificaties naar de QuestPDF-API (C#). Geen HTML nodig — de layout wordt in code opgebouwd.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;font:400 12px/1.4 'IBM Plex Sans',sans-serif;color:#1F2A1E\"><div style=\"display:grid;grid-template-columns:150px 210px minmax(0,1fr);gap:12px;padding:0 0 7px;border-bottom:2px solid #00532D;font:700 10px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;color:#56664F\"><span>ONDERDEEL<\u002Fspan><span>WAT<\u002Fspan><span>QUESTPDF<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 210px minmax(0,1fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(31,42,30,.12)\"><b>Paginaformaat<\u002Fb><span style=\"color:#56664F\">A4/A3, staand/liggend, marge 0<\u002Fspan><span style=\"min-width:0\"><span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">page.Size(PageSizes.A4)<\u002Fspan><br><span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">page.Size(PageSizes.A4.Landscape())<\u002Fspan><br><span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">page.Margin(0)<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 210px minmax(0,1fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(31,42,30,.12)\"><b>Eenheden<\u002Fb><span style=\"color:#56664F\">mm en pt uit 36a 1-op-1<\u002Fspan><span style=\"min-width:0\"><span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">.Padding(18, Unit.Millimetre)<\u002Fspan><br><span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">.FontSize(8.5f)<\u002Fspan> (pt is standaard)<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 210px minmax(0,1fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(31,42,30,.12)\"><b>Banden + kop<\u002Fb><span style=\"color:#56664F\">herhaalt op elke pagina<\u002Fspan><span style=\"min-width:0\"><span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">page.Header()<\u002Fspan> → band 6 mm + kop · <span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">page.Footer()<\u002Fspan> → voet + band<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 210px minmax(0,1fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(31,42,30,.12)\"><b>Zijmarge<\u002Fb><span style=\"color:#56664F\">18 mm op elke zone<\u002Fspan><span style=\"min-width:0\"><span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">.PaddingHorizontal(18, Unit.Millimetre)<\u002Fspan> op Header, Content en Footer (niet op de band)<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 210px minmax(0,1fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(31,42,30,.12)\"><b>Lettertypes<\u002Fb><span style=\"color:#56664F\">Playfair + Plex ingesloten<\u002Fspan><span style=\"min-width:0\"><span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">FontManager.RegisterFont(File.OpenRead(\"IBMPlexSans-Regular.ttf\"))<\u002Fspan> · <span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">.FontFamily(\"IBM Plex Sans\")<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 210px minmax(0,1fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(31,42,30,.12)\"><b>Spatiëring + regel<\u002Fb><span style=\"color:#56664F\">em en factor<\u002Fspan><span style=\"min-width:0\"><span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">.LetterSpacing(0.16f)<\u002Fspan> · <span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">.LineHeight(1.5f)<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 210px minmax(0,1fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(31,42,30,.12)\"><b>Tabelcijfers<\u002Fb><span style=\"color:#56664F\">bedragen uitlijnen<\u002Fspan><span style=\"min-width:0\"><span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#00532D\">.EnableFontFeature(FontFeatures.TabularFigures)<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 210px minmax(0,1fr  helft volgt bij de definitieve oplevering.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:6mm minmax(0,1fr);gap:2.4mm\"><span style=\"font:700 7.5pt 'IBM Plex Sans',sans-serif;color:#00532D\">5<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:.6mm\"><b style=\"font:600 7.8pt 'IBM Plex Sans',sans-serif;color:#1F2A1E\">Definitieve oplevering<\u002Fb><span style=\"font:400 7.4pt/1.55 'IBM Plex Sans',sans-serif;color:#1F2A1E;text-wrap:pretty\">Ten vroegste één jaar na deze voorlopige oplevering, op schriftelijk verzoek. Tijdens dat jaar worden de gebreken van pagina 1 hersteld.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:6mm minmax(0,1fr);gap:2.4mm\"><span style=\"font:700 7.5pt 'IBM Plex Sans',sans-serif;color:#00532D\">6<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:.6mm\"><b style=\"font:600 7.8pt 'IBM Plex Sans',sans-serif;color:#1F2A1E\">Stilzwijgende aanvaarding<\u002Fb><span style=\"font:400 7.4pt/1.55 'IBM Plex Sans',sans-serif;color:#1F2A1E;text-wrap:pretty\">Hadden de kopers niet gereageerd binnen 15 dagen na het schriftelijk verzoek, of was de woning al in gebruik genomen, dan gold de oplevering als aanvaard (behoudens tegenbewijs). Niet van toepassing: de oplevering vond tegensprekelijk plaats.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:4mm;margin-top:1.5mm\"><span style=\"font:700 6.5pt 'IBM Plex Sans',sans-serif;letter-spacing:.16em;color:#00532D;white-space:nowrap\">OPMERKINGEN VAN DE KOPER(S)<\u002Fspan><span style=\"flex:1;height:.3mm;background:rgba(31,42,30,.14)\"><\u002Fspan><\u002Fdiv><div style=\"height:16mm;border:.25mm solid rgba(31,42,30,.14);padding:2.4mm 3mm;font:italic 400 7.5pt 'IBM Plex Sans',sans-serif;color:#56664F\">Koper vraagt bevestiging van de herstelplanning per e-mail.<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:4mm;margin-top:1.5mm\"><span style=\"font:700
