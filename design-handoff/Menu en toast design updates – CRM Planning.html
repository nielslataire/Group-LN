  <title>Planning project</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Planning project...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

role=\"menuitem\" sc-camel-on-click=\"{{ cm.indGo }}\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:14px;height:14px;flex:none;fill:none;stroke:#4A5B48;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M9.4 5l3 3-3 3 M12.4 8h-9\"><\u002Fpath><\u002Fsvg>Inspringen<\u002Fbutton><button type=\"button\" role=\"menuitem\" sc-camel-on-click=\"{{ cm.outGo }}\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:14px;height:14px;flex:none;fill:none;stroke:#4A5B48;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M6.6 5 3.6 8l3 3 M3.6 8h9\"><\u002Fpath><\u002Fsvg>Uitspringen<\u002Fbutton><span class=\"pl-cms\"><\u002Fspan><button type=\"button\" role=\"menuitem\" class=\"del\" sc-camel-on-click=\"{{ cm.delGo }}\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M3 4.4h10 M6.4 4.4V3h3.2v1.4 M4.4 4.4l.6 8.6h6l.6-8.6\"><\u002Fpath><\u002Fsvg>Verwijderen…<kbd>Del<\u002Fkbd><\u002Fbutton><\u002Fdiv><\u002Fsc-if><\u002Fsc-if><sc-if value=\"{{ isGsm }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pl-m\"><div class=\"pl-mh\"><span class=\"pl-k2\">VILLA CAUXYDE · PLANNING<\u002Fspan><b>Bouwplanning v3<\u002Fb><span>{{ projStart }} – {{ projEnd }} · {{ projDur }} werkdagen<\u002Fspan><\u002Fdiv><div class=\"pl-mro\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:13px;height:13px;flex:none;fill:none;stroke:#2F4F7A;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M4.4 7.4h7.2v6H4.4z M5.8 7.4V5.6a2.2 2.2 0 0 1 4.4 0v1.8\"><\u002Fpath><\u002Fsvg>Alleen bekijken op gsm — bewerken op desktop of tablet<\u002Fdiv><sc-for list=\"{{ mobile }}\" as=\"m\" hint-placeholder-count=\"10\"><sc-if value=\"{{ m.g }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pl-mg\"><span>{{ m.wbs }}<\u002Fspan><b>{{ m.name }}<\u002Fb><span class=\"pl-d\">{{ m.se }}<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ m.notG }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"pl-mr\"><span class=\"pl-wbs\">{{ m.wbs }}<\u002Fspan><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\"><b>{{ m.name }}<\u002Fb><span class=\"pl-d\">{{ m.se }}<\u002Fspan><\u002Fdiv><span style=\"{{ m.stS }}\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:11px;height:11px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round\"><path d=\"{{ m.stI }}\"><\u002Fpath><\u002Fsvg>{{ m.stL }}<\u002Fspan><\u002Fdiv><\u002Fsc-if><\u002Fsc-for><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"status\" class=\"pl-toast\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:14px;height:14px;flex:none;fill:none;stroke:#D6E5CC;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M3.4 8.4l3 3 6.2-6.6\"><\u002Fpath><\u002Fsvg>{{ toast }}<\u002Fdiv><\u002Fsc-if><\u002Fdiv><div style=\"width:1600px;box-sizing:border-box;padding:14px 18px;background:#fff;border-radius:12px;font:450 12.5px/1.65 'IBM Plex Sans',sans-serif;color:#2C3B2A;margin-top:12px\"><b style=\"font-weight:700;color:#00532D;letter-spacing:.06em;font-size:11px\">WAT ER IS UITGEWERKT<\u002Fb><br>1 · <b>Kop<\u002Fb>: project, planning v3, start · einde · duur in werkdagen · deadline (rood + “te laat” als het einde erover gaat). Eén primaire knop <i>Taak toevoegen<\u002Fi>; Importeren, Exporteren (Excel/PDF) en de werkkalender ernaast.<br>2 · <b>Lijst en Gantt<\u002Fb> delen dezelfde rijen (34 px), dus ze scrollen samen. Fases klappen in en tonen samengevat begin, einde en duur; mijlpalen hebben een ruit. Naam, duur en voorgangers zijn inline te bewerken: typ <code>5.1FS+3d<\u002Fcode>, <code>4.2SS<\u002Fcode> of <code>2.8; 3.4<\u002Fcode>.<br>3 · <b>Automatisch verschuiven<\u002Fb>: na elke wijziging rekent alles opnieuw in werkdagen (FS/SS/FF/SF, wachttijd ook negatief, weekends, feestdagen, bouwverlof). De blauwe balk zegt wat er gebeurde — “7 andere taken verschoven · einde +4 werkdagen (13/03/2027)” — met <i>Ongedaan maken<\u002Fi>; verschoven rijen en balken krijgen een gouden markering en het label “verschoven”.<br>4 · <b>Vastgepind<\u002Fb> (punaise) schuift niet mee. Een balk slepen = de wachttijd op de bepalende voorganger aanpassen; zonder voorganger wordt de taak vastgepind. Rechterrand slepen = duur. Bolletje rechts naar een andere balk slepen = nieuwe FS-afhankelijkheid (een cyclus wordt geweigerd).<br>5 · <b>Kritiek pad<\u002Fb> (aan/uit): rode, gearceerde balken, rode pijlen en een “K” in de lijst — dus niet enkel kleur. In het zijpaneel staat de speling in werkdagen en welke voorganger de start bepaalt.<br>6 · <b>Toetsenbord<\u002Fb>: elke balk is een knop met een volledige beschrijving; ← → verschuift een werkdag, Shift + ← → wijzigt de duur, Enter opent het zijpaneel, Delete vraagt bevestiging.<br>7 · <b>Taak toevoegen<\u002Fb>: de knop in de kop (of <i>+ Taak<\u002Fi> op een faserij bij hover/focus) opent het paneel <i>Nieuwe taak<\u002Fi>: soort (taak/mijlpaal), naam, fase, plaats in de lijst, duur, verantwoordelijke en ‘start na’ (standaard de taak erboven). Een voorvertoning toont meteen het WBS-nummer, de data en hoeveel taken opschuiven. <i>Toevoegen<\u002Fi> sluit het paneel; <i>Toevoegen en nog één<\u002Fi> laat het open en zet de volgende taak erachter. Selecteer eerst een taak om er direct na toe te voegen.<br>8 · <b>Fase toevoegen<\u002Fb> (zoals een samenvattingstaak in MS Project): knop <i>+ Fase<\u002Fi> in de werkbalk of <i>Fase<\u002Fi> in het toevoegpaneel → naam, plaats (na een fase of als deelfase erin), ‘fase start na’ (geldt voor alle taken erin) en een eerste taak. Of vink bestaande rijen aan → <i>In nieuwe fase<\u002Fi> zet ze samen onder een nieuwe fase; WBS-nummers en voorgangers nummeren mee. Inspringen onder een taak maakt er ook een fase van.<br>9 · <b>Basisplanning<\u002Fb> (schakelaar in de werkbalk): grijze lijn onder elke balk = de vastgelegde planning van 28/08/2026, kolom <i>AFW.<\u002Fi> = afwijking van het einde in werkdagen (+ later, − vroeger; ook met teken, niet enkel kleur). In de kop: datum van de basis en de afwijking van het projecteinde, met <i>Opnieuw vastleggen<\u002Fi> (bevestiging).<br>10 · <b>Beperkingen<\u002Fb> per taak (zoals MS Project): zo vroeg mogelijk · moet beginnen op (= vastgepind) · niet eerder/later beginnen dan · niet eerder/later eindigen dan · moet eindigen op, plus een optionele <b>deadline<\u002Fb>. ‘Niet later dan’ en deadlines duwen niets maar geven een waarschuwing; de andere sturen de datum. Haakje in de Gantt = beperkingsdatum, vlaggetje = deadline. Voorbeeld: 5.4 Keuken niet eerder dan 01/03/2027, 3.7 deadline 18/12/2026, 4.7 keuring niet later dan 29/01/2027.<br>11 · <b>Werkelijke start en einde<\u002Fb> in het taakpaneel (of <i>Vandaag gestart<\u002Fi> / <i>Vandaag klaar<\u002Fi>): overschrijven planning en voorgangers, opvolgers rekenen vanaf het werkelijke einde. In de lijst staat een vinkje voor een werkelijke datum; een taak die had moeten starten zonder werkelijke start krijgt de status <i>Niet gestart<\u002Fi>.<br>12 · <b>Rechtstreeks in de planning<\u002Fb> (zoals MS Project): rechtsklik op een balk of rij (of Shift+F10 / menutoets) opent een menu met voortgang 0-25-50-75-100 %, <i>Markeren als voltooid<\u002Fi>, <i>Vandaag gestart<\u002Fi>, <i>Bijwerken volgens schema<\u002Fi>, bewerken, taak eronder, vastpinnen, in/uitspringen en verwijderen. Het donkere deel van een balk is de voortgang: sleep het streepje om ze aan te passen (100 % = voltooid met werkelijke data). Het rondje voor een taaknaam vinkt ze in één klik af. Rijen sleep je aan het ⋮⋮-handvat naar een andere plaats of fase. Ook mijlpalen zijn versleepbaar, en een <b>hele fase<\u002Fb>: sleep de donkere fasebalk (of ← → op de fasebalk) en alle taken erin schuiven mee — via de wachttijd van de fase of van haar eerste taken, anders met een beperking ‘niet eerder beginnen dan’. Een fase die al gestart is, schuift niet. Tijdens het slepen toont een label de nieuwe datum, duur of voortgang; bij hover een fiche met data, voortgang, speling, voorgangers en basis. Toetsenbord op een balk: 0–4 = 0/25/50/75/100 %.<br>13 · <b>Verletdagen<\u002Fb> komen uit het verletregister (andere pagina) en tellen hier mee als niet-werkdag: blauw gearceerd in de Gantt, aantal in de kop, ‘incl. 2 verletdagen’ bij de taak, lijst in de werkkalender (alleen lezen) met een schakelaar om ze uit te zetten als simulatie. De basisplanning rekent zonder verlet, dus de afwijking toont ook de impact van verlet.<br>14 · <b>Afdrukken<\u002Fb> (Exporteren › PDF, zie 59d): A3 liggend in de Documentlayout-stijl met kerngegevens, lijst en Gantt, legende en voet; kies periode (hele project / komende 3 maanden), detail (alle taken / enkel fases) en wat je toont (basis, kritiek pad, voortgang, verlet).<br>15 · <b>Selectie<\u002Fb>: vink rijen aan → donkere balk met Uitspringen, Inspringen, Omhoog, Omlaag, Voltooid, Bijwerken volgens schema, 0–100 %, In nieuwe fase en Verwijderen (altijd met bevestiging; ongedaan te maken).<br>16 · <b>Tablet<\u002Fb>: takenlijst ingeklapt tot WBS + naam (uitklapbaar), Gantt scrolt. <b>Gsm<\u002Fb>: enkel een lijst met start en einde, alleen lezen. Probeer bovenaan Toestel.<br>17 · <b>Werkkalender<\u002Fb> (kalender-icoon): werkweek, feestdagen en bouwverlof, met “eigen kalender voor dit project” tegenover de bedrijfskalender in Instellingen › Planning. Elke wijziging herrekent de planning meteen.<\u002Fdiv><\u002Fdiv>\n<div id=\"59b\" style=\"margin-top:48px\"><div style=\"display:flex;align-items:baseline;gap:8px;font:400 12px/1.3 'IBM Plex Sans',sans-serif;color:rgba(0,0,0,.55);margin-bottom:9px\"><a href=\"#59b\" style=\"font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;padding:3px 7px;background:rgba(0,0,0,.08);color:#00532D;border-radius:5px;text-decoration:none\">59b<\u002Fa>Importeren — stappen Bestand · Controle · Opties · Resultaat (klik “Bestand kiezen”)<\u002Fdiv><div class=\"im\" data-screen-label=\"59b\"><div class=\"im-head\"><div class=\"pl-tt\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:17px;height:17px;flex:none;fill:none;stroke:#00532D;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M8 13.4V6 M5 8.8 8 5.8l3 3 M3 3.2h10\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px;flex:1\"><h2>Planning importeren<\u002Fh2><span style=\"font:450 12px 'IBM Plex Sans',sans-serif;color:#5a6b58\">Villa Cauxyde · vanuit MS Project of Excel<\u002Fspan><\u002Fdiv><a class=\"pl-x\" href=\"#59a\" aria-label=\"Sluiten\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:14px;height:14px;flex:none;fill:none;stroke:#2C3B2A;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M4 4l8 8 M12 4l-8 8\"><\u002Fpath><\u002Fsvg><\u002Fa><\u002Fdiv><div class=\"im-steps\" aria-label=\"Stappen\"><sc-for list=\"{{ imp.steps }}\" as=\"s\" hint-placeholder-count=\"4\"><span class=\"{{ s.c }}\" aria-current=\"{{ s.cur }}\"><i>{{ s.n }}<\u002Fi>{{ s.l }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><div class=\"im-b\"><sc-if value=\"{{ imp.s0 }}\" hint-placeholder-val=\"{{ true }}\"><sc-if value=\"{{ imp.noFile }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"{{ imp.dropC }}\" sc-camel-on-drag-over=\"{{ imp.dragOn }}\" sc-camel-on-drag-leave=\"{{ imp.dragOff }}\" sc-camel-on-drop=\"{{ imp.drop }}\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:28px;height:28px;flex:none;fill:none;stroke:#7A9E6E;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M8 10.4V2.8 M5 5.8 8 2.8l3 3 M2.8 10.4v2.8h10.4v-2.8\"><\u002Fpath><\u002Fsvg><b>Sleep je bestand hierheen<\u002Fb><span>MS Project-XML (.xml) of Excel / CSV · max. 10 MB<\u002Fspan><button type=\"button\" class=\"pl-b2\" sc-camel-on-click=\"{{ imp.pick }}\">Bestand kiezen<\u002Fbutton><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ imp.file }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"im-file\"><span class=\"im-ty\">XML<\u002Fspan><div style=\"flex:1;display:flex;flex-direction:column;gap:2px\"><b style=\"font:600 13.5px 'IBM Plex Sans',sans-serif;color:#2C3B2A\">Villa_Cauxyde_planning_v3.xml<\u002Fb><span style=\"font:450 12px 'IBM Plex Sans',sans-serif;color:#4A5B48\">MS Project-XML · 184 kB · 46 regels gevonden<\u002Fspan><\u002Fdiv><button type=\"button\" class=\"pl-lnk\" sc-camel-on-click=\"{{ imp.unpick }}\">Ander bestand<\u002Fbutton><\u002Fdiv><\u002Fsc-if><div class=\"im-g3\"><div class=\"im-help\" style=\"grid-column:span 2\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:16px;height:16px;flex:none;fill:none;stroke:#2F4F7A;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12z M8 7.4v3.4 M8 5.2h.01\"><\u002Fpath><\u002Fsvg><span><b>Een .mpp-bestand?<\u002Fb> Dat kan niet rechtstreeks. Open het in MS Project › <b>Bestand › Opslaan als<\u002Fb> › kies <b>XML-indeling (*.xml)<\u002Fb> en sleep dat bestand hierheen. Taken, duur, voorgangers en fases gaan mee.<\u002Fspan><\u002Fdiv><div class=\"im-k\" style=\"justify-content:center\"><span>LIEVER EXCEL?<\u002Fspan><a href=\"#\" style=\"font:600 12.5px 'IBM Plex Sans',sans-serif\">Sjabloon downloaden (.xlsx)<\u002Fa><small style=\"font:450 11px 'IBM Plex Sans',sans-serif;color:#5a6b58\">kolommen WBS, naam, duur, voorgangers, start<\u002Fsmall><\u002Fdiv><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ imp.s1 }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"im-g3\" style=\"grid-template-columns:repeat(5,minmax(0,1fr))\"><div class=\"im-k\"><span>TAKEN<\u002Fspan><b>41<\u002Fb><\u002Fdiv><div class=\"im-k\"><span>FASES<\u002Fspan><b>5<\u002Fb><\u002Fdiv><div class=\"im-k\"><span>MIJLPALEN<\u002Fspan><b>4<\u002Fb><\u002Fdiv><div class=\"im-k\"><span>AFHANKELIJKHEDEN<\u002Fspan><b>54<\u002Fb><\u002Fdiv><div class=\"im-k w\"><span>AANDACHTSPUNTEN<\u002Fspan><b>4 + 2 fouten<\u002Fb><\u002Fdiv><\u002Fdiv><div class=\"pl-warn\" style=\"gap:4px\"><div class=\"pl-wh\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:15px;height:15px;flex:none;fill:none;stroke:#8A6A32;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M8 2 14.4 13.4H1.6z M8 6.6v3 M8 11.6h.01\"><\u002Fpath><\u002Fsvg>Wat er gebeurt met wat we niet ondersteunen<\u002Fdiv><div class=\"pl-wi\" style=\"padding-left:23px\">Resources en kosten worden genegeerd · duren in uren worden afgerond naar werkdagen · beperkingen (niet eerder/later dan, moet beginnen/eindigen op), deadlines, basisplanning en werkelijke data gaan mee; enkel “zo laat mogelijk” wordt “zo vroeg mogelijk” · ontbrekende voorgangers en cycli worden weggelaten.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:10px\"><div class=\"pl-seg sm\"><sc-for list=\"{{ imp.filters }}\" as=\"f\" hint-placeholder-count=\"2\"><button type=\"button\" class=\"{{ f.c }}\" sc-camel-on-click=\"{{ f.go }}\">{{ f.l }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><span style=\"font:450 12px 'IBM Plex Sans',sans-serif;color:#5a6b58\">Voorbeeld van de eerste regels<\u002Fspan><\u002Fdiv><div class=\"im-tab\" role=\"table\"><div class=\"im-th\" role=\"row\"><span>STATUS<\u002Fspan><span>WBS<\u002Fspan><span>TAAK<\u002Fspan><span>SOORT<\u002Fspan><span>DUUR<\u002Fspan><span>VOORGANGERS<\u002Fspan><span>MELDING<\u002Fspan><\u002Fdiv><sc-for list=\"{{ imp.rows }}\" as=\"r\" hint-placeholder-count=\"8\"><div class=\"{{ r.c }}\" role=\"row\"><span><span class=\"im-chip\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:11px;height:11px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round\"><path d=\"{{ r.stI }}\"><\u002Fpath><\u002Fsvg>{{ r.stL }}<\u002Fspan><\u002Fspan><span class=\"pl-d\">{{ r.wbs }}<\u002Fspan><span><span style=\"{{ r.indS }}\">{{ r.n }}<\u002Fspan><\u002Fspan><span>{{ r.ty }}<\u002Fspan><span class=\"pl-d\">{{ r.du }}<\u002Fspan><span class=\"pl-d\">{{ r.pr }}<\u002Fspan><span style=\"font-size:12px;color:#4A5B48\">{{ r.m }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ imp.s2 }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pl-f\"><span class=\"pl-fl\">WAT MET DE HUIDIGE PLANNING<\u002Fspan><div class=\"im-cards\" role=\"radiogroup\"><sc-for list=\"{{ imp.modes }}\" as=\"o\" hint-placeholder-count=\"2\"><button type=\"button\" role=\"radio\" aria-checked=\"{{ o.on }}\" class=\"{{ o.c }}\" sc-camel-on-click=\"{{ o.go }}\"><span class=\"im-ring\"><i><\u002Fi><\u002Fspan><span><b>{{ o.l }}<\u002Fb><small>{{ o.s }}<\u002Fsmall><\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv><div class=\"pl-f\"><span class=\"pl-fl\">STARTDATUM<\u002Fspan><div class=\"im-cards\" role=\"radiogroup\"><sc-for list=\"{{ imp.smodes }}\" as=\"o\" hint-placeholder-count=\"2\"><button type=\"button\" role=\"radio\" aria-checked=\"{{ o.on }}\" class=\"{{ o.c }}\" sc-camel-on-click=\"{{ o.go }}\"><span class=\"im-ring\"><i><\u002Fi><\u002Fspan><span><b>{{ o.l }}<\u002Fb><small>{{ o.s }}<\u002Fsmall><\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fdiv><sc-if value=\"{{ imp.newStart }}\" hint-placeholder-val=\"{{ false }}\"><label class=\"pl-f\" style=\"width:260px\"><span class=\"pl-fl\">NIEUWE STARTDATUM<\u002Fspan><span class=\"pl-box\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:14px;height:14px;flex:none;fill:none;stroke:#4A5B48;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M2.8 3.8h10.4v9.4H2.8z M2.8 6.6h10.4 M5.4 2.4v2.4 M10.6 2.4v2.4\"><\u002Fpath><\u002Fsvg><input value=\"{{ imp.start }}\" sc-camel-on-change=\"{{ imp.onStart }}\" placeholder=\"dd/mm/jjjj\"><\u002Fspan><small>Alle taken schuiven mee; vast >Nu opnieuw proberen<\u002Fbutton><button type=\"button\" class=\"pl-b2\">Wijziging kopiëren<\u002Fbutton><\u002Fdiv><span style=\"display:inline-flex;align-items:center;gap:6px;font:500 11.5px 'IBM Plex Sans',sans-serif;color:#8B2A2A\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:13px;height:13px;flex:none;fill:none;stroke:#8B2A2A;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M8 13.4A5.4 5.4 0 1 0 8 2.6a5.4 5.4 0 0 0 0 10.8z M6 6l4 4 M10 6l-4 4\"><\u002Fpath><\u002Fsvg>In de kopbalk: \"Niet opgeslagen · 1 wijziging\"<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"st\"><div class=\"st-l\">IEMAND ANDERS WIJZIGDE INTUSSEN<\u002Fdiv><div class=\"st-b\"><div style=\"background:#fff;border-radius:12px;box-shadow:0 20px 40px -20px rgba(31,42,30,.45);padding:16px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"width:32px;height:32px;flex:none;border-radius:16px;background:#E3EAF3;color:#2F4F7A;display:flex;align-items:center;justify-content:center;font:600 11px 'IBM Plex Sans',sans-serif\">NL<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:3px\"><b style=\"font:600 14px 'IBM Plex Sans',sans-serif;color:#2C3B2A\">Nele Lataire wijzigde de planning<\u002Fb><span style=\"font:450 12px/1.5 'IBM Plex Sans',sans-serif;color:#4A5B48\">om 10:41 · 3 taken: 4.6 Droogtijd chape 20 → 25 d, 5.3 voorganger, 5.8 vastgepind. Jij wijzigde intussen 5.1.<\u002Fspan><\u002Fdiv><\u002Fdiv><ul style=\"margin:0;padding:8px 12px;border-radius:8px;background:#F7F9F5;list-style:none;font:450 12px/1.7 'IBM Plex Sans',sans-serif;color:#2C3B2A\"><li>Geen conflict: haar 3 en jouw 1 wijziging raken elkaar niet.<\u002Fli><\u002Ful><div style=\"display:flex;gap:8px;justify-content:flex-end\"><button type=\"button\" class=\"pl-txt\">Hun versie bekijken<\u002Fbutton><button type=\"button\" class=\"pl-b1\">Samenvoegen<\u002Fbutton><\u002Fdiv><\u002Fdiv><span style=\"font:450 11.5px/1.5 'IBM Plex Sans',sans-serif;color:#5a6b58\">Raken de wijzigingen dezelfde taak, dan kies je per taak: hun waarde of de jouwe.<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"st\"><div class=\"st-l\">ALLEEN LEZEN<\u002Fdiv><div class=\"st-b\"><div class=\"pl-sum\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:15px;height:15px;flex:none;fill:none;stroke:#2F4F7A;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M4.4 7.4h7.2v6H4.4z M5.8 7.4V5.6a2.2 2.2 0 0 1 4.4 0v1.8\"><\u002Fpath><\u002Fsvg><span><b>Alleen lezen<\u002Fb> — je kan de planning bekijken, exporteren en filteren, maar niet wijzigen. Vraag bewerkrecht aan Nele Lataire.<\u002Fspan><\u002Fdiv><span style=\"font:450 12px/1.6 'IBM Plex Sans',sans-serif;color:#4A5B48\">· Geen \"Taak toevoegen\", \"Importeren\" of kalender in de kop<br>· Cellen zijn tekst, geen velden · balken niet sleepbaar (wel focusbaar, Enter opent de taak alleen-lezen)<br>· Chip ALLEEN LEZEN naast de titel<\u002Fspan><span style=\"font:450 11.5px 'IBM Plex Sans',sans-serif;color:#2F4F7A\">Probeer het bovenaan: Rechten › Alleen lezen.<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"st\"><div class=\"st-l\">WAARSCHUWINGEN<\u002Fdiv><div class=\"st-b\"><div class=\"pl-warn\"><div class=\"pl-wh\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:16px;height:16px;flex:none;fill:none;stroke:#8A6A32;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M8 2 14.4 13.4H1.6z M8 6.6v3 M8 11.6h.01\"><\u002Fpath><\u002Fsvg><b>3 aandachtspunten<\u002Fb><\u002Fdiv><div class=\"pl-wi\"><span><b>Cyclus in de afhankelijkheden<\u002Fb> 4.3 → 4.5 → 4.3 — deze taken wachten op elkaar.<\u002Fspan><button type=\"button\" class=\"pl-lnk\">Toon taak<\u002Fbutton><\u002Fdiv><div class=\"pl-wi\"><span><b>5.11 Afvoer werfafval heeft geen voorganger<\u002Fb> Ze start op de eerste projectdag.<\u002Fspan><button type=\"button\" class=\"pl-lnk\">Toon taak<\u002Fbutton><\u002Fdiv><div class=\"pl-wi\"><span><b>Einde 24/03/2027 valt na de deadline 17/03/2027<\u002Fb> 5 werkdagen te laat.<\u002Fspan><button type=\"button\" class=\"pl-lnk\">Kritiek pad tonen<\u002Fbutton><\u002Fdiv><\u002Fdiv><span style=\"font:450 11.5px/1.5 'IBM Plex Sans',sans-serif;color:#5a6b58\">Eén gouden kader onder de kop, blijft tot het opgelost is (meldingskaders 25). Probeer in 59a: maak 5.1 Pleisterwerken 20 dagen.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1700,&quot;height&quot;:1400}}\">\n// ===== planning-rekenkern (geen DOM) =====\nconst PL = (() => {\n  const DAY = 86400000;\n  const dn = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / DAY);\n  const parts = n => { const d = new Date(n * DAY); return [d.getUTCDate(), d.getUTCMonth() + 1, d.getUTCFullYear(), d.getUTCDay()]; };\n  const p2 = x => String(x).padStart(2, '0');\n  const fmt = n => { const [d, m, y] = parts(n); return p2(d) + '/' + p2(m) + '/' + y; };\n  const fmtS = n => { const [d, m] = parts(n); return p2(d) + '/' + p2(m); };\n  const parseDate = s => { const m = String(s).trim().match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/); if (!m) return null; const v = dn(+m[3], +m[2], +m[1]); const [d, mm] = parts(v); return d === +m[1] && mm === +m[2] ? v : null; };\n  const MON = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];\n  const MONS = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];\n  const DOW = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];\n\n  function calendar(cal, start) {\n    const hol = new Set(cal.hol.map(h => h.d)); const vt = new Set(cal.verletOn === false ? [] : (cal.verlet || []).map(v => v.d));\n    const isWork = n => { const w = parts(n)[3]; if (!cal.week[w]) return false; if (hol.has(n) || vt.has(n)) return false; for (const v of cal.verlof) if (n >= v.a && n <= v.b) return false; return true; };\n    const W = []; let n = start; let guard = 0;\n    while (W.length < 900 && guard < 3000) { if (isWork(n)) W.push(n); n++; guard++; }\n    const ordOf = d => { let lo = 0, hi = W.length - 1; if (d <= W[0]) return 0; if (d > W[hi]) return hi; while (lo < hi) { const mid = (lo + hi) >> 1; if (W[mid] >= d) hi = mid; else lo = mid + 1; } return lo; }; // eerste werkdag >= d\n    const ordAtOrBefore = d => { const o = ordOf(d); return W[o] > d ? Math.max(0, o - 1) : o; };\n    return { isWork, W, ordOf, ordAtOrBefore };\n  }\n\n  // structuur: ouder, groep, kinderen\n  function tree(tasks) {\n    const parent = {}, isGroup = {}, leaves = {}, stack = [];\n    tasks.forEach((t, i) => {\n      while (stack.length && tasks[stack[stack.length - 1]].lvl >= t.lvl) stack.pop();\n      parent[t.id] = stack.length ? tasks[stack[stack.length - 1]].id : null;\n      stack.push(i);\n      isGroup[t.id] = !!(tasks[i + 1] && tasks[i + 1].lvl > t.lvl);\n    });\n    const byId = {}; tasks.forEach(t => { byId[t.id] = t; });\n    const leafOf = id => { if (!isGroup[id]) return [id]; const out = []; const i0 = tasks.indexOf(byId[id]); for (let i = i0 + 1; i < tasks.length && tasks[i].lvl > byId[id].lvl; i++) if (!isGroup[tasks[i].id]) out.push(tasks[i].id); return out; };\n    tasks.forEach(t => { leaves[t.id] = leafOf(t.id); });\n    // WBS\n    const wbs = {}, cnt = [];\n    tasks.forEach(t => { cnt.length = t.lvl + 1; cnt[t.lvl] = (cnt[t.lvl] || 0) + 1; wbs[t.id] = cnt.slice(0, t.lvl + 1).join('.'); for (let k = t.lvl + 1; k < 10; k++) cnt[k] = 0; });\n    return { parent, isGroup, leaves, byId, wbs };\n  }\n\n  function schedule(tasks, cal, start) {\n    const C = calendar(cal, start);\n    const T = tree(tasks);\n    const leafIds = tasks.filter(t => !T.isGroup[t.id]).map(t => t.id);\n    // effectieve voorgangers (eigen + van ouders), groepsvoorganger -> alle bladeren\n    const eff = {};\n    leafIds.forEach(id => {\n      const list = []; let cur = id;\n      while (cur) { (T.byId[cur].preds || []).forEach(p => { if (!T.byId[p.id]) return; T.leaves[p.id].forEach(l => { if (l !== id) list.push({ id: l, type: p.type, lag: p.lag, own: cur === id, src: p.id }); }); }); cur = T.parent[cur]; }\n      eff[id] = list;\n    });\n    // topo\n    const indeg = {}, succ = {}; leafIds.forEach(id => { indeg[id] = 0; succ[id] = []; });\n    leafIds.forEach(id => eff[id].forEach(p => { if (indeg[p.id] === undefined) return; indeg[id]++; succ[p.id].push(id); }));\n    const q = leafIds.filter(id => indeg[id] === 0), order = [];\n    while (q.length) { const id = q.shift(); order.push(id); succ[id].forEach(s => { if (--indeg[s] === 0) q.push(s); }); }\n    const inCycle = leafIds.filter(id => !order.includes(id));\n    const S = {}, E = {}, D = {}, done = new Set(), conflict = {}, viol = {}, late = {};\n    const doOne = id => {\n      const t = T.byId[id], d = Math.max(0, t.dur | 0);\n      let mx = -Infinity, drv = null;\n      eff[id].forEach(p => {\n        if (!done.has(p.id)) return;\n        let c;\n        if (p.type === 'SS') c = S[p.id] + p.lag; else if (p.type === 'FF') c = E[p.id] + p.lag - d; else if (p.type === 'SF') c = S[p.id] + p.lag - d; else c = E[p.id] + p.lag;\n        if (c > mx) { mx = c; drv = p; }\n      });\n      let s = Math.max(0, mx === -Infinity ? 0 : mx), dd = d; t._con = false; t._act = false;\n      if (t.pin != null) { const ps = C.ordOf(t.pin); if (ps < s) conflict[id] = s; s = ps; drv = null; }\n      const cn = t.con;\n      if (cn && cn.d != null && t.pin == null) {\n        const so = C.ordOf(cn.d), eo = C.ordAtOrBefore(cn.d) + 1;\n        if (cn.type === 'SNET' && so > s) { s = so; drv = null; t._con = true; }\n        else if (cn.type === 'FNET' && eo - dd > s) { s = eo - dd; drv = null; t._con = true; }\n        else if (cn.type === 'MFO') { if (eo - dd < s) conflict[id] = s; s = Math.max(0, eo - dd); drv = null; t._con = true; }\n        else if (cn.type === 'SNLT' && s > C.ordAtOrBefore(cn.d)) viol[id] = s - C.ordAtOrBefore(cn.d);\n        else if (cn.type === 'FNLT' && s + dd > eo) viol[id] = s + dd - eo;\n      }\n      if (d === 0) { if (t.aE != null) { s = C.ordAtOrBefore(t.aE) + 1; dd = 0; drv = null; t._act = true; } }\n      else {\n        if (t.aS != null) { s = C.ordOf(t.aS); drv = null; t._act = true; }\n        if (t.aE != null) { const e = C.ordAtOrBefore(t.aE) + 1; dd = Math.max(1, e - s); t._act = true; }\n      }\n      S[id] = s; E[id] = s + dd; D[id] = dd; done.add(id); t._drv = drv;\n      if (t.dl != null) { const lo = C.ordAtOrBefore(t.dl) + 1; if (E[id] > lo) late[id] = E[id] - lo; }\n    };\n    order.forEach(doOne); inCycle.forEach(doOne);\n    // backward\n    let PE = 0; leafIds.forEach(id => { PE = Math.max(PE, E[id]); });\n    const LE = {}; leafIds.forEach(id => { LE[id] = PE; });\n    [...order].reverse().forEach(id => {\n      const d = D[id];\n      succ[id].forEach(sid => {\n        const sd = D[sid], LSs = LE[sid] - sd;\n        eff[sid].filter(p => p.id === id).forEach(p => {\n          let v;\n          if (p.type === 'SS') v = LSs - p.lag + d; else if (p.type === 'FF') v = LE[sid] - p.lag; else if (p.type === 'SF') v = LE[sid] - p.lag + d; else v = LSs - p.lag;\n          LE[id] = Math.min(LE[id], v);\n        });\n      });\n    });\n    const R = {};\n    leafIds.forEach(id => { const fl = (T.byId[id].pin != null) ? LE[id] - E[id] : LE[id] - E[id]; R[id] = { S: S[id], E: E[id], float: fl, crit: fl <= 0 && !inCycle.includes(id), cyc: inCycle.includes(id) }; });\n    tasks.forEach(t => {\n      if (!T.isGroup[t.id]) return;\n      const ls = T.leaves[t.id]; if (!ls.length) { R[t.id] = { S: 0, E: 0, float: 0, crit: false }; return; }\n      R[t.id] = { S: Math.min(...ls.map(l => S[l])), E: Math.max(...ls.map(l => E[l])), float: 0, crit: ls.some(l => R[l].crit) };\n    });\n    const isMil = id => !T.isGroup[id] && (T.byId[id].dur | 0) === 0 && !(D[id] > 0);\n    const milD = id => R[id].S > 0 ? C.W[R[id].S - 1] : C.W[0];\n    const dateS = id => isMil(id) ? milD(id) : C.W[R[id].S], dateE = id => { const r = R[id]; if (isMil(id)) return milD(id); return r.E > r.S ? C.W[r.E - 1] : C.W[r.S]; };\n    return { R, T, C, PE, D, endDn: C.W[Math.max(0, PE - 1)], dateS, dateE, isMil, inCycle, conflict, viol, late, eff, order };\n  }\n  return { dn, parts, fmt, fmtS, parseDate, MON, MONS, DOW, schedule, calendar, tree };\n})();\n\n// ===== voorbeelddata: Villa Cauxyde, 5 fases =====\nconst PL_DATA = () => {\n  const { dn } = PL;\n  const rows = [\n    [0, 'vb', 'Voorbereiding'],\n    [1, 'vg', 'Omgevingsvergunning definitief', 0, '', 'Bouwheer'],\n    [1, 'wi', 'Werfinrichting en afsluiting', 3, 'vg', 'Bouw & Beton Driessens'],\n    [1, 'ui', 'Uitzetten gebouw door landmeter', 1, 'wi', 'Landmeter De Wilde'],\n    [1, 'nw', 'Tijdelijke nutsaansluiting werf', 5, 'wi:SS+1', 'Fluvius'],\n    [0, 'rb', 'Ruwbouw'],\n    [1, 'gw', 'Grondwerken en uitgraving', 5, 'ui', 'Grondwerken Mertens'],\n    [1, 'fu', 'Funderingen (strokenfundering)', 6, 'gw', 'Bouw & Beton Driessens'],\n    [1, 'ri', 'Riolering en putten', 4, 'gw:SS+2', 'Grondwerken Mertens'],\n    [1, 'kr', 'Kruipruimte en keldermuren', 8, 'fu', 'Bouw & Beton Driessens'],\n    [1, 'vp', 'Vloerplaat gelijkvloers', 4, 'kr', 'Bouw & Beton Driessens'],\n    [1, 'm1', 'Metselwerk gelijkvloers', 12, 'vp', 'Bouw & Beton Driessens'],\n    [1, 'we', 'Welfsels verdieping', 3, 'm1', 'Bouw & Beton Driessens'],\n    [1, 'm2', 'Metselwerk verdieping', 10, 'we', 'Bouw & Beton Driessens'],\n    [1, 'rk', 'Ruwbouw klaar', 0, 'm2', 'Bouwheer', { traj: 'Ruwbouw klaar' }],\n    [0, 'dg', 'Dak en gevel'],\n    [1, 'ds', 'Dakstructuur (houten spanten)', 5, 'rk', 'Dakwerken Demeyer'],\n    [1, 'db', 'Dakbedekking en isolatie', 8, 'ds', 'Dakwerken Demeyer'],\n    [1, 'dk', 'Dakgoten en afvoeren', 3, 'db:SS+5', 'Dakwerken Demeyer'],\n    [1, 'bs', 'Buitenschrijnwerk plaatsen', 6, 'm2:FS+2', 'Ramen Van Hoecke'],\
