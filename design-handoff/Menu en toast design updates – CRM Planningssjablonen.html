  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e=\"font:600 12px 'IBM Plex Sans',sans-serif;color:#2C3B2A\">{{ unitsEnd }}<\u002Fsmall><\u002Fsection><section class=\"pl-card ic-sec\"><div class=\"ic-sh\"><div><b>Controle<\u002Fb><\u002Fdiv><\u002Fdiv><sc-if value=\"{{ noIssues }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"sj-ok\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:13px;height:13px;flex:none;fill:none;stroke:#2F6038;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M3.4 8.4l3 3 6.2-6.6\"><\u002Fpath><\u002Fsvg>Geen cycli, geen onbekende codes, alles hangt aan elkaar.<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ hasIssues }}\" hint-placeholder-val=\"{{ false }}\"><sc-for list=\"{{ issues }}\" as=\"i\" hint-placeholder-count=\"1\"><div class=\"{{ i.cls }}\"><b>{{ i.t }}<\u002Fb><span>{{ i.s }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fsc-if><\u002Fsection><section class=\"pl-card ic-sec\"><button type=\"button\" class=\"sj-hh\" aria-expanded=\"{{ help }}\" sc-camel-on-click=\"{{ helpGo }}\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:14px;height:14px;flex:none;fill:none;stroke:#00532D;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12z M8 7.4v3.4 M8 5.2h.01\"><\u002Fpath><\u002Fsvg><b>Hoe werkt dit?<\u002Fb><span style=\"flex:1\"><\u002Fspan><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:12px;height:12px;flex:none;fill:none;stroke:#4A5B48;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round\"><path d=\"{{ helpI }}\"><\u002Fpath><\u002Fsvg><\u002Fbutton><sc-if value=\"{{ help }}\" hint-placeholder-val=\"{{ false }}\"><ul class=\"sj-help\"><li><b>Code<\u002Fb> — elk blok en elke taak krijgt bij het aanmaken een vaste code (grijs onder de naam). Voorgangers verwijzen naar die code, dus een naam wijzigen breekt niets.<\u002Fli><li><b>Voorgangers<\u002Fb> — klik op + voorganger en kies een taak of een heel blok (= al zijn taken). Klik op een voorganger om het type (FS, SS, FF, SF) en de wachttijd te kiezen, bv. “Funderingen SS+3d”.<\u002Fli><li><b>Estafette<\u002Fb> <svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:12px;height:12px;flex:none;fill:none;stroke:#2F6038;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M1.8 8.4 4.6 6l2.8 2.4v4.4H1.8z M8.6 8.4 11.4 6l2.8 2.4v4.4H8.6z M7.4 4.2h1.4 M8.2 3.4l.8.8-.8.8\"><\u002Fpath><\u002Fsvg> — bij meerdere woningen wacht de taak op dezelfde taak in de woning ervoor. Via ⋯ voeg je extra wachtdagen toe.<\u002Fli><li><b>Per verdieping<\u002Fb> — het blok komt terug als “Technieken ruwbouw verdieping 1, 2 …”; elke verdieping start na de vorige.<\u002Fli><li><b>Komt voor<\u002Fb> — het blok valt weg als het project niet aan de voorwaarde voldoet (bv. enkel met kelder).<\u002Fli><\u002Ful><\u002Fsc-if><\u002Fsection><\u002Faside><\u002Fdiv><\u002Fdiv><sc-if value=\"{{ anyMenu }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pl-ov\" style=\"background:transparent;z-index:9\" sc-camel-on-click=\"{{ closeAll }}\"><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ pickOn }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pl-ov\" style=\"background:rgba(31,42,30,.18)\" sc-camel-on-click=\"{{ pick.close }}\"><\u002Fdiv><div class=\"sj-pk\" role=\"dialog\" aria-label=\"Voorganger kiezen\"><div class=\"sj-pkh\"><div style=\"display:flex;flex-direction:column;gap:2px;flex:1\"><span class=\"pl-k2\">VOORGANGER VOOR<\u002Fspan><b>{{ pick.title }}<\u002Fb><\u002Fdiv><button type=\"button\" class=\"pl-x\" aria-label=\"Sluiten\" sc-camel-on-click=\"{{ pick.close }}\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:13px;height:13px;flex:none;fill:none;stroke:#2C3B2A;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M4 4l8 8 M12 4l-8 8\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv><sc-if value=\"{{ pick.isEdit }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"sj-rel\"><div class=\"pl-seg sm\"><sc-for list=\"{{ pick.types }}\" as=\"o\" hint-placeholder-count=\"4\"><button type=\"button\" class=\"{{ o.c }}\" sc-camel-on-click=\"{{ o.go }}\" title=\"{{ o.l }}\">{{ o.k }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><span class=\"pl-box\" style=\"height:32px;width:96px\"><input type=\"number\" value=\"{{ pick.lag }}\" sc-camel-on-change=\"{{ pick.onLag }}\" aria-label=\"Wachttijd in werkdagen\"><em>d<\u002Fem><\u002Fspan><\u002Fdiv><div class=\"sj-relt\">{{ pick.rel }}<\u002Fdiv><\u002Fsc-if><label class=\"pl-box\" style=\"margin:0 14px 8px\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:14px;height:14px;flex:none;fill:none;stroke:#4A5B48;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M7.2 12.2a5 5 0 1 0 0-10 5 5 0 0 0 0 10z M10.8 10.8l3 3\"><\u002Fpath><\u002Fsvg><input placeholder=\"Zoek taak of blok\" value=\"{{ pick.q }}\" sc-camel-on-change=\"{{ pick.onQ }}\"><\u002Flabel><div class=\"sj-pl\"><sc-for list=\"{{ pick.groups }}\" as=\"g\" hint-placeholder-count=\"3\"><div class=\"sj-pg\">{{ g.b }}<\u002Fdiv><sc-for list=\"{{ g.items }}\" as=\"x\" hint-placeholder-count=\"4\"><button type=\"button\" class=\"{{ x.c }}\" sc-camel-on-click=\"{{ x.go }}\"><span>{{ x.n }}<\u002Fspan><code>{{ x.code }}<\u002Fcode><\u002Fbutton><\u002Fsc-for><\u002Fsc-for><\u002Fdiv><div class=\"sj-pkf\"><span>FS = na het einde · SS = samen starten · FF = samen eindigen · wachttijd mag negatief<\u002Fspan><button type=\"button\" class=\"pl-b2 sm\" sc-camel-on-click=\"{{ pick.close }}\">Klaar<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pl-toast\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:14px;height:14px;flex:none;fill:none;stroke:#D6E5CC;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M3.4 8.4l3 3 6.2-6.6\"><\u002Fpath><\u002Fsvg>{{ toast }}<\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"width:1600px;box-sizing:border-box;margin-top:14px;padding:14px 18px;background:#fff;border-radius:12px;font:450 12.5px/1.65 'IBM Plex Sans',sans-serif;color:#2C3B2A\"><b style=\"font-weight:700;color:#00532D;letter-spacing:.06em;font-size:11px\">WAT ER VERANDERD IS<\u002Fb><br>1 · <b>Eén regel per taak<\u002Fb> in plaats van twee: naam (met de vaste code klein eronder), duur, voorgangers als chips met de <i>naam<\u002Fi> van de taak (de code staat in de tooltip), start in het voorbeeld, estafette en ⋯. Een blok met 6 taken is nu ±300 px hoog in plaats van ±500.<br>2 · <b>Voorganger toevoegen<\u002Fb> via “+ voorganger”: een kiezer met zoeken, gegroepeerd per blok, met “Hele blok …” bovenaan. Klik op een chip om het type (FS/SS/FF/SF) en de wachttijd te kiezen; een zin zegt wat het betekent (“Start samen met Funderingen, 3 werkdagen later”).<br>3 · <b>Estafette<\u002Fb> is een knop met een icoon van twee woningen (groen = aan) i.p.v. een schakelaar met tekst op elke rij. Extra wachtdagen via ⋯.<br>4 · <b>Omhoog / omlaag / verwijderen<\u002Fb> zaten als drie knoppen op elke rij (met een rode prullenbak); nu in ⋯ en via het handvat ⋮⋮. Verwijderen geeft een toast en Annuleren zet alles terug.<br>5 · <b>Blokken inklapbaar<\u002Fb> met in de kop: naam, code, aantal taken en duur, “Komt voor” en “Per verdieping”. Ingeklapte blokken houden de pagina kort.<br>6 · <b>Rechts een live voorbeeld<\u002Fb>: duur per blok, totale duur, kritiek pad, proefdraaien met 1–4 woningen en 1–3 verdiepingen (zie het effect van estafette en per verdieping), en een controle op cycli, onbekende codes en taken zonder voorganger. Opslaan met een rode fout kan niet.<br>7 · <b>Lijst<\u002Fb> (63a) toont ook de duur, waar het sjabloon gebruikt wordt en wanneer/wie het laatst wijzigde. “Reageert op” bepaalt of het sjabloon automatisch voorgesteld wordt.<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1700,&quot;height&quot;:1400}}\">\nconst slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_|_$/g, '');\nconst T = (n, d, p, est) => ({ code: slug(n), n, d, p: p || [], est: est || 0 });\nconst P = (code, type, lag) => ({ code, type: type || 'FS', lag: lag || 0 });\nconst INIT = [\n  { code: 'RUWBOUW', n: 'Ruwbouw', when: 'Altijd', floor: false, open: true, t: [\n    T('Funderingen en vloerplaat', 10), T('Rioleringswerken', 4, [P('FUNDERINGEN_EN_VLOERPLAAT', 'SS', 3)]), T('Metselwerk gelijkvloers', 12, [P('FUNDERINGEN_EN_VLOERPLAAT')], 2),\n    T('Verdiepingsvloer (breedplaten)', 4, [P('METSELWERK_GELIJKVLOERS')]), T('Metselwerk verdieping', 12, [P('VERDIEPINGSVLOER_BREEDPLATEN')], 2), T('Ruwbouw afgewerkt', 0, [P('METSELWERK_VERDIEPING'), P('RIOLERINGSWERKEN')])] },\n  { code: 'DAK_EN_GEVEL', n: 'Dak en gevel (winddicht)', when: 'Altijd', floor: false, open: true, t: [\n    T('Dakstructuur', 6, [P('RUWBOUW_AFGEWERKT')]), T('Dakbedekking', 5, [P('DAKSTRUCTUUR')]), T('Buitenschrijnwerk', 30, [P('DAKSTRUCTUUR')]), T('Gevelwerken', 15, [P('DAKBEDEKKING')]), T('Gebouw winddicht', 0, [P('DAKBEDEKKING'), P('BUITENSCHRIJNWERK')])] },\n  { code: 'TECHNIEKEN_RUWBOUW', n: 'Technieken ruwbouw', when: 'Altijd', floor: true, open: false, t: [\n    T('Ruwbouw elektriciteit', 8, [P('GEBOUW_WINDDICHT')]), T('Sanitair en verwarming ruwbouw', 10, [P('GEBOUW_WINDDICHT')]), T('Ventilatie', 5, [P('SANITAIR_EN_VERWARMING_RUWBOUW', 'SS', 3)])] },\n  { code: 'BINNENAFWERKING', n: 'Binnenafwerking', when: 'Altijd', floor: false, open: false, t: [\n    T('Pleisterwerk', 10, [P('RUWBOUW_ELEKTRICITEIT'), P('SANITAIR_EN_VERWARMING_RUWBOUW')], 0), T('Dekvloeren', 5, [P('PLEISTERWERK')]), T('Droogtijd dekvloer', 15, [P('DEKVLOEREN')]),\n    T('Tegelwerken', 8, [P('DROOGTIJD_DEKVLOER')]), T('Binnenschrijnwerk', 6, [P('DROOGTIJD_DEKVLOER')]), T('Schilderwerken', 10, [P('TEGELWERKEN'), P('BINNENSCHRIJNWERK')])] },\n  { code: 'AFWERKING_TECHNIEKEN_EN_OPLEVERING', n: 'Afwerking technieken en oplevering', when: 'Altijd', floor: false, open: false, t: [\n    T('Afwerking elektriciteit', 5, [P('SCHILDERWERKEN')]), T('Sanitair plaatsen', 4, [P('SCHILDERWERKEN')]), T('Poetswerken', 3, [P('AFWERKING_ELEKTRICITEIT'), P('SANITAIR_PLAATSEN')]), T('Voorlopige oplevering', 1, [P('POETSWERKEN')])] }\n];\nconst WHEN = ['Altijd', 'Enkel met kelder', 'Enkel bij appartementen', 'Enkel bij woningen', 'Enkel met lift'];\nconst TYPES = [['FS', 'na einde'], ['SS', 'samen starten'], ['FF', 'samen eindigen'], ['SF', 'start → einde']];\n\nclass Component extends DCLogic {\n  state = { B: JSON.parse(JSON.stringify(INIT)), dirty: false, pick: null, q: '', menu: null, units: 1, floors: 2, toast: '', name: 'Woning halfopen — 2 bouwlagen', desc: 'Standaard voor halfopen en open woningen met verdieping, zonder kelder', act: true, trig: 'Niets — handmatig toepassen', help: false, list: 'alle' };\n  flash(m) { this.setState({ toast: m }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2600); }\n  upd(f, msg) { const B = JSON.parse(JSON.stringify(this.state.B)); f(B); this.setState({ B, dirty: true }); if (msg) this.flash(msg); }\n  // ---- voorbeeld: uitrollen (verdiepingen, woningen) + vroegste start in werkdagen\n  sched(B, units, floors) {\n    const all = [], byCode = {}, blockOf = {};\n    B.forEach(b => b.t.forEach(t => { blockOf[t.code] = b.code; }));\n    const reps = b => b.floor ? floors : 1;\n    for (let u = 0; u < units; u++) B.forEach(b => { for (let f = 0; f < reps(b); f++) b.t.forEach(t => { const id = t.code + '#' + u + '#' + f; const x = { id, t, b, u, f }; all.push(x); byCode[id] = x; }); });\n    const blockLeaves = (bc, u) => all.filter(x => x.b.code === bc && x.u === u);\n    const preds = x => {\n      const out = [];\n      x.t.p.forEach(p => {\n        if (blockOf[p.code] === undefined && B.some(b => b.code === p.code)) { blockLeaves(p.code, x.u).forEach(y => out.push({ y, type: 'FS', lag: p.lag })); return; }\n        const pb = B.find(b => b.code === blockOf[p.code]); if (!pb) return;\n        const sameBlock = pb.code === x.b.code;\n        const fl = sameBlock ? [x.f] : (pb.floor ? [...Array(reps(pb)).keys()] : [0]);\n        const useFl = (!sameBlock && pb.floor && x.b.floor) ? [Math.min(x.f, reps(pb) - 1)] : fl;\n        useFl.forEach(f => { const y = byCode[p.code + '#' + x.u + '#' + f]; if (y) out.push({ y, type: p.type, lag: p.lag }); });\n      });\n      if (x.b.floor && x.f > 0 && x.t === x.b.t[0]) { const y = byCode[x.b.t[0].code + '#' + x.u + '#' + (x.f - 1)]; if (y) out.push({ y, type: 'SS', lag: Math.max(1, x.t.d) }); }\n      if (x.t.est && x.u > 0) { const y = byCode[x.t.code + '#' + (x.u - 1) + '#' + x.f]; if (y) out.push({ y, type: 'FS', lag: x.t.est - 1 }); }\n      return out;\n    };\n    const S = {}, E = {}, P2 = {}; all.forEach(x => { P2[x.id] = preds(x); });\n    // Kahn\n    const indeg = {}, succ = {}; all.forEach(x => { indeg[x.id] = 0; succ[x.id] = []; });\n    all.forEach(x => P2[x.id].forEach(p => { indeg[x.id]++; succ[p.y.id].push(x); }));\n    const q = all.filter(x => !indeg[x.id]), order = [];\n    while (q.length) { const x = q.shift(); order.push(x); succ[x.id].forEach(s => { if (--indeg[s.id] === 0) q.push(s); }); }\n    const cyc = all.filter(x => !order.includes(x)).map(x => x.t.code);\n    order.forEach(x => {\n      let s = 0; const d = x.t.d;\n      P2[x.id].forEach(({ y, type, lag }) => { const c = type === 'FS' ? E[y.id] + lag : type === 'SS' ? S[y.id] + lag : type === 'FF' ? E[y.id] + lag - d : S[y.id] + lag - d; if (c > s) s = c; });\n      S[x.id] = Math.max(0, s); E[x.id] = S[x.id] + d;\n    });\n    const end = Math.max(0, ...order.map(x => E[x.id]));\n    // kritiek pad (enkel woning 0, eenvoudige backward pass)\n    const LF = {}; [...order].reverse().forEach(x => { let lf = end; succ[x.id].forEach(s => { const p = P2[s.id].find(p => p.y === x); const ls = (LF[s.id] ?? end) - s.t.d; const c = p.type === 'FS' ? ls - p.lag : p.type === 'SS' ? ls - p.lag + x.t.d : p.type === 'FF' ? LF[s.id] - p.lag : LF[s.id] - p.lag + x.t.d - 0; if (c < lf) lf = c; }); LF[x.id] = lf; });\n    const crit = new Set(order.filter(x => LF[x.id] - E[x.id] <= 0).map(x => x.t.code));\n    return { all, S, E, end, cyc, crit, order };\n  }\n  renderVals() {\n    const S = this.state, set = o => this.setState(o), B = S.B;\n    const codes = []; B.forEach(b => b.t.forEach(t => codes.push({ code: t.code, n: t.n, b: b.n })));\n    const nameOf = c => (codes.find(x => x.code === c) || { n: (B.find(b => b.code === c) || { n: c }).n + ' (hele blok)' }).n;\n    const R = this.sched(B, 1, S.floors), RU = this.sched(B, S.units, S.floors);\n    const nT = codes.length;\n    // controles\n    const issues = [];\n    if (R.cyc.length) issues.push({ c: 'red', t: 'Cyclus', s: [...new Set(R.cyc)].slice(0, 3).map(nameOf).join(' → ') + ' wachten op elkaar' });\n    B.forEach((b, bi) => b.t.forEach((t, ti) => { if (!t.p.length && !(bi === 0 && ti === 0)) issues.push({ c: 'gold', t: t.n + ' heeft geen voorganger', s: 'start op dag 1 van het project' }); }));\n    B.forEach(b => b.t.forEach(t => t.p.forEach(p => { if (!codes.some(c => c.code === p.code) && !B.some(x => x.code === p.code)) issues.push({ c: 'red', t: 'Onbekende code ' + p.code, s: 'in ' + t.n }); })));\n    const blocks = B.map((b, bi) => {\n      const lv = R.all.filter(x => x.b.code === b.code && x.f === 0);\n      const s0 = Math.min(...lv.map(x => R.S[x.id])), e0 = Math.max(...lv.map(x => R.E[x.id]));\n      const ub = fn => this.upd(B2 => fn(B2[bi]));\n      return {\n        n: b.n, code: b.code, open: b.open, closed: !b.open, tg: () => ub(x => { x.open = !x.open; }), tgI: b.open ? 'M4 6l4 4 4-4' : 'M6 4l4 4-4 4',\n        meta: b.t.length + ' taken · ' + (e0 - s0) + ' werkdagen' + (b.floor ? ' per verdieping' : ''), when: b.when, whenOpts: WHEN.map(v => ({ v, l: v })), onWhen: e => ub(x => { x.when = e.target.value; }),\n        floor: b.floor, onFloor: () => ub(x => { x.floor = !x.floor; }), onName: e => ub(x => { x.n = e.target.value; }), cond: b.when !== 'Altijd',\n        menuOn: S.menu === 'b' + bi, menu: () => set({ menu: S.menu === 'b' + bi ? null : 'b' + bi }),\n        up: () => { this.upd(B2 => { if (bi > 0) [B2[bi - 1], B2[bi]] = [B2[bi], B2[bi - 1]]; }); set({ menu: null }); }, down: () => { this.upd(B2 => { if (bi < B2.length - 1) [B2[bi + 1], B2[bi]] = [B2[bi], B2[bi + 1]]; }); set({ menu: null }); },\n        dup: () => { this.upd(B2 => { const c = JSON.parse(JSON.stringify(B2[bi])); c.code += '_2'; c.n += ' (kopie)'; c.t.forEach(t => { t.code += '_2'; t.p.forEach(p => { if (c.t.some(x => x.code === p.code + '_2')) p.code += '_2'; }); }); B2.splice(bi + 1, 0, c); }, 'Blok gedupliceerd met eigen codes'); set({ menu: null }); },\n        del: () => { this.upd(B2 => { B2.splice(bi, 1); }, 'Blok “' + b.n + '” verwijderd — Annuleren zet het terug'); set({ menu: null }); },\n        addT: () => this.upd(B2 => { const prev = B2[bi].t[B2[bi].t.length - 1]; B2[bi].t.push({ code: 'NIEUWE_TAAK_' + (Date.now() % 1000), n: 'Nieuwe taak', d: 5, p: prev ? [P(prev.code)] : [], est: 0 }); }),\n        tasks: b.t.map((t, ti) => {\n          const ut = fn => this.upd(B2 => fn(B2[bi].t[ti]));\n          const k = bi + '.' + ti, x = R.all.find(y => y.t.code === t.code && y.f === 0);\n          return {\n            n: t.n, code: t.code, d: String(t.d), mil: t.d === 0, crit: R.crit.has(t.code), rowC: 'sj-tr' + (S.pick && S.pick.k === k ? ' pk' : ''),\n            onName: e => ut(x => { x.n = e.target.value; }), onDur: e => ut(x => { x.d = Math.max(0, parseInt(e.target.value, 10) || 0); }),\n            start: x ? 'dag ' + (R.S[x.id] + 1) : '', est: t.est > 0, estOff: !t.est, estL: t.est ? 'wacht op vorige woning' + (t.est > 1 ? ' + ' + (t.est - 1) + ' d' : '') : 'Estafette uit',\n            estGo: () => ut(x => { x.est = x.est ? 0 : 1; }), estC: 'sj-est' + (t.est ? ' (b => b.t.filter(t => R.crit.has(t.code)).map(t => t.n));\n    return {\n      name: S.name, desc: S.desc, act: S.act, onName: e => set({ name: e.target.value, dirty: true }), onDesc: e => set({ desc: e.target.value, dirty: true }), actGo: () => set({ act: !S.act, dirty: true }),\n      trig: S.trig, trigOpts: ['Niets — handmatig toepassen', 'Traject: bouwvergunning definitief', 'Traject: start der werken', 'Nieuw project van type Woning'].map(v => ({ v, l: v })), onTrig: e => set({ trig: e.target.value, dirty: true }),\n      dirty: S.dirty, blocks, addB: () => this.upd(B2 => { B2.push({ code: 'NIEUW_BLOK_' + B2.length, n: 'Nieuw blok', when: 'Altijd', floor: false, open: true, t: [{ code: 'EERSTE_TAAK_' + B2.length, n: 'Eerste taak', d: 5, p: [], est: 0 }] }); }),\n      allOpen: () => this.upd(B2 => B2.forEach(b => { b.open = true; })), allClose: () => this.upd(B2 => B2.forEach(b => { b.open = false; })),\n      pick, pickOn: pick.on, closeAll: () => set({ menu: null, pick: null }), anyMenu: !!S.menu,\n      total: R.end + ' werkdagen', totalW: '± ' + Math.round(R.end / 5 * 7 / 30.4) + ' maanden', nT: String(nT), nB: String(B.length), critL: crit.join(' → '),\n      prev, units: S.units, floors: S.floors, unitsV, unitsEnd: RU.end + ' werkdagen voor ' + S.units + ' woning' + (S.units > 1 ? 'en' : ''),\n      uSeg: [1, 2, 3, 4].map(n => ({ l: String(n), c: S.units === n ? 'on' : '', go: () => set({ units: n }) })), fSeg: [1, 2, 3].map(n => ({ l: String(n), c: S.floors === n ? 'on' : '', go: () => set({ floors: n }) })),\n      issues: issues.map(i => Object.assign(i, { cls: 'sj-iss ' + i.c })), hasIssues: issues.length > 0, noIssues: !issues.length, issN: issues.length + ' aandachtspunt' + (issues.length === 1 ? '' : 'en'),\n      help: S.help, helpGo: () => set({ help: !S.help }), helpI: S.help ? 'M4 9.8 8 6l4 3.8' : 'M4 6.2 8 10l4-3.8',\n      save: () => { if (issues.some(i => i.c === 'red')) { this.flash('Los eerst de rode punten op'); return; } set({ dirty: fa
