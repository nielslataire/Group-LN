  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;

              const { done, value } = await reader.read();

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x 12px;font:500 10.5px 'IBM Plex Sans',sans-serif;color:#5a6b58\">Trace-ID van deze controle<span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#4A5B48\">{{ sv.trace }}<\u002Fspan><button type=\"button\" class=\"ip-copy\" aria-label=\"Trace-ID kopiëren\" sc-camel-on-click=\"{{ sv.traceCopy }}\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M5.4 5.4h7.2v7.2H5.4z M3.4 10.6V3.4h7.2\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv><div style=\"position:relative;display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid rgba(44,59,42,.08)\"><span style=\"font:450 11.5px 'IBM Plex Sans',sans-serif;color:#5a6b58;flex:1\">Bewaard als bewijs · testgegevens<\u002Fspan><button type=\"button\" class=\"ip-btn2\" sc-camel-on-click=\"{{ sv.reuse }}\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M2.8 8a5.2 5.2 0 1 0 1.6-3.8 M2.6 2.6v2.8h2.8\"><\u002Fpath><\u002Fsvg>Opnieuw selecteren<\u002Fbutton><button type=\"button\" class=\"ip-btn2\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M8 2.6v7.4 M5 7.2 8 10.2l3-3 M3 12.8h10\"><\u002Fpath><\u002Fsvg>Bewijs (PDF)<\u002Fbutton><button type=\"button\" aria-label=\"Meer\" aria-expanded=\"{{ sv.menuOn }}\" sc-camel-on-click=\"{{ sv.menuTog }}\" class=\"ip-btn2\" style=\"width:34px;padding:0;justify-content:center\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M3.4 8h.01 M8 8h.01 M12.6 8h.01\"><\u002Fpath><\u002Fsvg><\u002Fbutton><sc-if value=\"{{ sv.menuOn }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"menu\" style=\"position:absolute;right:20px;bottom:56px;width:230px;background:#fff;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 40px -16px rgba(31,42,30,.45);padding:6px;display:flex;flex-direction:column\"><button type=\"button\" role=\"menuitem\" class=\"ip-mi\" sc-camel-on-click=\"{{ sv.json }}\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:14px;height:14px;flex:none;fill:none;stroke:#4A5B48;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M5.4 3c-1.4 0-1.6.8-1.6 2v1c0 .8-.4 1.6-1.4 2 1 .4 1.4 1.2 1.4 2v1c0 1.2.2 2 1.6 2 M10.6 3c1.4 0 1.6.8 1.6 2v1c0 .8.4 1.6 1.4 2-1 .4-1.4 1.2-1.4 2v1c0 1.2-.2 2-1.6 2\"><\u002Fpath><\u002Fsvg><span>Bewijs (JSON)<small>ruw antwoord van de RSZ<\u002Fsmall><\u002Fspan><\u002Fbutton><button type=\"button\" role=\"menuitem\" class=\"ip-mi\" sc-camel-on-click=\"{{ sv.traceCopy }}\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 16 16\" style=\"width:14px;height:14px;flex:none;fill:none;stroke:#4A5B48;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M5.4 5.4h7.2v7.2H5.4z M3.4 10.6V3.4h7.2\"><\u002Fpath><\u002Fsvg><span>Trace-ID kopiëren<small>voor een vraag aan de RSZ<\u002Fsmall><\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Faside><\u002Fdiv><div style=\"width:520px;box-sizing:border-box;padding:16px 18px;background:#fff;border-radius:12px;font:450 12.5px/1.65 'IBM Plex Sans',sans-serif;color:#2C3B2A\"><b style=\"font-weight:700;color:#00532D;letter-spacing:.06em;font-size:11px\">WAT ER ANDERS IS<\u002Fb><br>1 · <b>Eén kaart per onderneming<\u002Fb> in plaats van een tabelrij met een losse rij “Referentie / Trace-ID / Attest” eronder. Wat bij elkaar hoort, staat samen; de bewijsnummers zitten in een lichte voetstrook met een kopieerknop.<br>2 · <b>Inhoudingsplicht eerst<\u002Fb>: ondernemingen met schulden staan bovenaan, met een rood omlijnde kaart. De melding noemt wie en hoeveel: “0663.024.001: 35 % aan de RSZ en 15 % aan de FOD Financiën”, niet een algemene zin.<br>3 · <b>“Geldig t.e.m.” één keer<\u002Fb> bovenaan in plaats van zes keer dezelfde datum. Verschilt een datum toch, dan staat ze bij die onderneming.<br>4 · <b>Trace-ID één keer<\u002Fb>: die is voor de hele controle dezelfde (fcf2f16a…), dus hoort hij niet op elke rij. Je hebt hem enkel nodig als je de RSZ iets vraagt.<br>5 · <b>Naam onbekend<\u002Fb> wordt grijs en schuin, met “Koppelen aan leverancier” — niet het nummer twee keer onder elkaar. Een gekende naam komt uit je leveranciers in plaats van de HOOFDLETTERS van de RSZ.<br>6 · <b>Nummers opgemaakt<\u002Fb> als BE0433.984.532, zoals overal in het CRM.<br>7 · <b>Cijfers in IBM Plex<\u002Fb> in één samenvattingsbalk; Playfair is voor titels. De drie tegels waren groot voor drie getallen.<br>8 · <b>Titel<\u002Fb>: “Zonder naam” wordt “Controle van 09/11/2026 17:21” met de knop “Naam geven”.<br>9 · <b>Voet op één regel<\u002Fb>: Opnieuw selecteren · Bewijs (PDF) · ⋯. Bewijs (JSON) is technisch en zit in het ⋯-menu, zodat de PDF-knop niet meer op een tweede lijn valt.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1780,&quot;height&quot;:1360}}\">\nclass Component extends DCLogic {\n  state = this.initState();\n  initState() {\n    const act = this.activeWerven();\n    const sel = {};\n    this.suppliers().filter(s => s.w.some(w => act.includes(w))).forEach(s => { sel[s.id] = true; });\n    return {\n      src: 'actief', werf: {}, sq: '', sel,\n      extra: 'Renovatie Bauwens; 0767.412.093\\nBE0532.118.409, BE0645920117\\nBE0539.87',\n      name: '', q: '', open: null, toast: '', lists: null, extraNames: {}\n    };\n  }\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  activeWerven() { return ['Verkaveling Keerstraat', 0123456789','nee','nee'],['BE0987654321','nee','nee']] },\n      { id: 'l6', d: '06/11/2026 10:42', t: 'Betaalronde november — Keerstraat', by: 'Nele Lataire', items: [['BE0428551274','nee','nee'],['BE0456112903','ja','nee'],['BE0478663215','nee','nee'],['BE0693215880','nee','nee'],['BE0724118356','nee','nee'],['BE0712384506','nee','nee']] },\n      { id: 'l5', d: '03/11/2026 16:05', t: 'Schijf 3 — Villa Cauxyde', by: 'Niels Lataire', items: [['BE0645920117','nee','ja'],['BE0811204739','nee','nee'],['BE0539877402','fout','fout'],['BE0123456789','nee','nee']] },\n      { id: 'l4', d: '27/10/2026 09:12', t: 'Nieuwe onderaannemers Aalter', by: 'Elisabeth', items: [['NL854312907B01','onb','onb'],['BE0712384506','nee','nee'],['BE0987654321','nee','nee']] },\n      { id: 'l3', d: '20/10/2026 14:31', t: 'Betaalronde oktober — Keerstraat', by: 'Nele Lataire', items: [['BE0428551274','nee','nee'],['BE0456112903','nee','nee'],['BE0478663215','nee','nee'],['BE0693215880','nee','nee'],['BE0724118356','nee','nee'],['BE0712384506','nee','nee']] },\n      { id: 'l2', d: '14/03/2026 11:08', t: 'Koksijde — afwerking', by: 'Niels Lataire', items: [['BE0401556823','nee','nee'],['BE0866301447','nee','nee']] }\n    ];\n  }\n\n  renderVals() {\n    const G = '#00532D', F = \"'IBM Plex Sans',sans-serif\";\n    const S = this.suppliers();\n    const ACT = this.activeWerven();\n    const lists = this.state.lists || this.history();\n    const byId = {}; S.forEach(s => { byId[s.id] = s; });\n    const names = Object.assign({}, ...S.map(s => ({ [s.id]: s.n })), this.state.extraNames);\n    const TODAY = '09/11/2026';\n    const toNum = d => { const [dd, mm, yy] = d.slice(0, 10).split('/'); return +(yy + mm + dd); };\n    const YEAR_AGO = 20251109;\n\n    const fmt = id => /^BE\\d{10}$/.test(id) ? `BE${id.slice(2,6)}.${id.slice(6,9)}.${id.slice(9)}` : id;\n    const norm = raw => {\n      const s = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');\n      let m;\n      if ((m = s.match(/^(?:BE)?(\\d{9,10})$/))) return { id: 'BE' + m[1].padStart(10, '0') };\n      if (/^(BE)?\\d+$/.test(s)) return { bad: true };\n      if (/^[A-Z]{2}[A-Z0-9]{4,14}$/.test(s)) return { id: s, foreign: true };\n      return { bad: true };\n    };\n    const icons = {\n      home: 'M2.4 13.4V6.4L8 2.6l5.6 3.8v7z M6.2 13.4V9.2h3.6v4.2',\n      taken: 'M3 2.8h10v10.4H3z M5.4 6l1 1 1.8-2 M5.4 10l1 1 1.8-2 M9.6 6.2h1.6 M9.6 10.2h1.6',\n      dead: 'M2.8 3.8h10.4v9.4H2.8z M2.8 6.6h10.4 M5.4 2.4v2.4 M10.6 2.4v2.4 M6 9.8l1.4 1.4 2.6-2.8',\n      lev: 'M1.8 4.6h7.4v6H1.8z M9.2 6.8h2.4l2.6 2.2v1.6H9.2z',\n      klant: 'M6 7.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M2.5 13c0-2 1.6-3.2 3.5-3.2S9.5 11 9.5 13 M11 6.2a1.6 1.6 0 1 0 0-3.2 M11.2 9.9c1.4.2 2.3 1.3 2.3 3.1',\n      proj: 'M2.6 13.4V4.6L8 2.6v10.8 M8 6h5.4v7.4 M4.6 6.4h1.4 M4.6 9h1.4 M10 8.6h1.4 M10 11h1.4 M1.6 13.4h12.8',\n      fact: 'M3.4 2.4h7l2.2 2.2v9H3.4z M5.6 6.4h4.8 M5.6 8.8h4.8 M5.6 11.2h2.8',\n      doc: 'M2.4 9.6h3.2l1 1.6h2.8l1-1.6h3.2 M2.4 3.2h11.2v10H2.4z',\n      gear: 'M8 10.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4z M8 1.8v1.8 M8 12.4v1.8 M1.8 8h1.8 M12.4 8h1.8 M3.6 3.6l1.3 1.3 M11.1 11.1l1.3 1.3 M3.6 12.4l1.3-1.3 M11.1 4.9l1.3-1.3',\n      markt: 'M2.6 13.4h10.8 M4 11V8 M7 11V5 M10 11V7 M13 11V3.4',\n      link: 'M6.6 9.4 9.4 6.6 M7 4.6l1.2-1.2a2.6 2.6 0 0 1 3.7 3.7L10.7 8.3 M9 11.4l-1.2 1.2a2.6 2.6 0 0 1-3.7-3.7L5.3 7.7'\n    };\n    const railDef = [['Dashboard','home'],['Mijn taken','taken'],['Deadlines','dead'],['Leveranciers','lev'],['Klanten','klant'],['Projecten','proj'],['Facturatie','fact'],['Documentencentrum','doc'],['Instellingen','gear'],['Marktanalyse','markt'],['Links','link']];\n    const rail = railDef.map(([n, k]) => ({ n, d: icons[k], bg: k === 'lev' ? G : '#fff', st: k === 'lev' ? '#fff' : '#2C3B2A' }));\n\n    const I = { ok: 'M3.4 8.4l3 3 6.2-6.6', plicht: 'M8 3v6 M8 12.4h.01', fout: 'M4.4 4.4l7.2 7.2 M11.6 4.4l-7.2 7.2', onb: 'M6.3 6a1.8 1.8 0 0 1 3.5.6c0 1.2-1.8 1.4-1.8 2.6 M8 12h.01', nieuw: 'M8 3.4v9.2 M3.4 8h9.2', warn: 'M8 2 14.4 13.4H1.6z M8 6.6v3 M8 11.6h.01' };\n    const P = { ok: ['#EDF2E8', '#2F6038'], plicht: ['#F6E3E3', '#8B2A2A'], fout: ['#EDEFEB', '#4A5B48'], onb: ['#F6EEDC', '#6B5226'], nieuw: ['#E3EAF3', '#2F4F7A'], warn: ['#F6EEDC', '#6B5226'] };\n    const chipS = k => `display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font:600 11px ${F};padding:3px 8px 3px 6px;border-radius:5px;background:${P[k][0]};color:${P[k][1]}`;\n    const statusOf = (a, b) => a === 'fout' ? 'fout' : (a === 'ja' || b === 'ja') ? 'plicht' : a === 'onb' ? 'onb' : 'ok';\n    const statusLabel = (a, b) => {\n      const s = statusOf(a, b);\n      if (s === 'plicht') return a === 'ja' && b === 'ja' ? 'Inhouden: RSZ + fiscus' : a === 'ja' ? 'Inhouden: RSZ' : 'Inhouden: fiscus';\n      return { ok: 'Geen inhoudingsplicht', fout: 'Mislukt', onb: 'Niet gekend bij RSZ' }[s];\n    };\n    const hist = {};\n    lists.forEach(l => l.items.forEach(([id, a, b]) => { (hist[id] = hist[id] || []).push({ d: l.d, a, b }); }));\n    const lastOf = id => (hist[id] || [])[0];\n\n    // ---- extra btw-nummers\n    const extraEntries = [];\n    const seenX = {};\n    String(this.state.extra).split('\\n').forEach(line => {\n      const raw = line.trim(); if (!raw) return;\n      let nm = '', nums;\n      if (raw.includes(';') || raw.includes('\\t')) { const p = raw.split(/[;\\t]/); nm = p[0].trim(); nums = [p.slice(1).join(' ')]; }\n      else nums = raw.split(/,/);\n      nums.forEach(nraw => { if (!nraw.trim()) return; const e = Object.assign({ nm, raw: nraw.trim() }, norm(nraw)); if (e.id) { if (seenX[e.id]) return; seenX[e.id] = true; } extraEntries.push(e); });\n    });\n    const extraAuto = {}; // nummers die een bestaande leverancier zijn → aangevinkt\n    extraEntries.forEach(e => { if (e.id && byId[e.id]) extraAuto[e.id] = true; });\n    const sel = Object.assign({}, this.state.sel, extraAuto);\n\n    // ---- bron + filter\n    const src = this.state.src;\n    const werfOff = this.state.werf;\n    const inSrc = s => src === 'alle' ? true : src === 'jaar' ? toNum(s.f) >= YEAR_AGO : s.w.some(w => ACT.includes(w) && !werfOff[w]);\n    const sq = this.state.sq.trim().toLowerCase(), sqD = sq.replace(/[^0-9]/g, '');\n    const matchSq = s => !sq || s.n.toLowerCase().includes(sq) || s.a.toLowerCase().includes(sq) || (sqD.length >= 3 && s.id.includes(sqD));\n    let visible = S.filter(s => inSrc(s) && matchSq(s));\n    if (src === 'jaar') visible = visible.sort((a, b) => toNum(b.f) - toNum(a.f));\n    const cnt = { actief: S.filter(s => s.w.some(w => ACT.includes(w))).length, jaar: S.filter(s => toNum(s.f) >= YEAR_AGO).length, alle: S.length };\n    const segS = on => `height:32px;padding:0 12px;border-radius:7px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:${on ? 600 : 500} 12.5px ${F};color:${on ? G : '#4A5B48'};background:${on ? '#fff' : 'transparent'};${on ? 'box-shadow:0 1px 2px rgba(44,59,42,.12)' : ''}`;\n    const sources = [['actief', 'Actieve werven'], ['jaar', 'Laatste 12 maanden'], ['alle', 'Alle leveranciers']].map(([v, l]) => ({ l, c: cnt[v], on: src === v, s: segS(src === v), go: () => this.setState({ src: v }) }));\n    const werfChips = ACT.map(w => {\n      const on = !werfOff[w];\n      return { l: w, c: S.filter(s => s.w.includes(w)).length, on,\n        s: `height:30px;padding:0 11px 0 9px;border-radius:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:${on ? 600 : 500} 12px ${F};border:1px solid ${on ? G : 'rgba(44,59,42,.16)'};background:${on ? '#EDF2E8' : '#fff'};color:${on ? G : '#4A5B48'}`,\n        ic: `width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;${on ? '' : 'opacity:0;width:0;margin-right:-6px'}`,\n        go: () => this.setState({ werf: Object.assign({}, werfOff, { [w]: on }) }) };\n    });\n    const wS = w => { const a = ACT.includes(w); return `font:500 11px ${F};padding:2px 7px;border-radius:4px;white-space:nowrap;background:${a ? '#EDF2E8' : '#EDEFEB'};color:${a ? '#2F6038' : '#5a6b58'}`; };\n    const toggle = id => { const n = Object.assign({}, this.state.sel); if (sel[id]) { delete n[id]; if (extraAuto[id]) this.dropExtra(id, norm); } else n[id] = true; this.setState({ sel: n }); };\n    const rows = visible.map(s => {\n      const h = lastOf(s.id); const k = h ? statusOf(h.a, h.b) : 'nieuw';\n      const on = !!sel[s.id];\n      return { cid: 'cb-' + s.id, on, toggle: () => toggle(s.id), n: s.n, act: s.a, id: fmt(s.id), f: s.f,\n        werven: s.w.map(w => ({ l: w + (ACT.includes(w) ? '' : ' · afgewerkt'), s: wS(w) })),\n        chipS: chipS(k), chipI: I[k], chipL: h ? statusLabel(h.a, h.b) : 'Nog nooit gecontroleerd',\n        cd: h ? (h.d.startsWith(TODAY) ? 'vandaag om ' + h.d.slice(11) : h.d.slice(0, 10)) : '',\n        trS: `border-top:1px solid rgba(44,59,42,.07);${on ? 'background:#F7FAF4' : ''}` };\n    });\n    const allOn = visible.length > 0 && visible.every(s => sel[s.id]);\n    const toggleAll = () => { const n = Object.assign({}, this.state.sel); visible.forEach(s => { if (allOn) delete n[s.id]; else n[s.id] = true; }); this.setState({ sel: n }); };\n\n    // ---- selectie rechts\n    const selIds = S.filter(s => sel[s.id]).map(s => s.id);\n    const selList = selIds.map(id => {\n      const h = lastOf(id); const k = h ? statusOf(h.a, h.b) : '';\n      const warn = k === 'plicht' || k === 'fout';\n      return { n: names[id], warn, chipS: warn ? chipS(k) : '', chipL: k === 'plicht' ? 'vorige: inhouden' : 'vorige: mislukt', rmL: `${names[id]} weghalen`, rm: () => toggle(id) };\n    });\n    const extraOnly = extraEntries.filter(e => !(e.id && byId[e.id]));\n    const extraList = extraOnly.map(e => {\n      if (e.bad) return { id: e.raw, sub: 'wordt overgeslagen', chipS: chipS('warn'), chipI: I.warn, chipL: 'Ongeldig' };\n      const h = lastOf(e.id); const k = h ? statusOf(h.a, h.b) : 'nieuw';\n      return { id: fmt(e.id), sub: names[e.id] || e.nm || (e.foreign ? 'buitenlands btw-nummer' : 'naam volgt uit de RSZ'), chipS: chipS(k), chipI: I[k], chipL: h ? statusLabel(h.a, h.b) : 'Nieuw' };\n    });\n    const extraValid = extraOnly.filter(e => e.id);\n    const extraMatched = extraEntries.filter(e => e.id && byId[e.id]).length;\n    const bad = extraOnly.filter(e => e.bad).length;\n    const total = selIds.length + extraValid.length;\n    const plichtSel = [...selIds, ...extraValid.map(e => e.id)].filter(id => { const h = lastOf(id); return h && statusOf(h.a, h.b) === 'plicht'; }).length;\n\n    const run = () => {\n      if (!total) return;\n      const ids = [...selIds, ...extraValid.map(e => e.id)];\n      const items = ids.map(id => { const h = lastOf(id); const fo = /^BE/.test(id) ? 'nee' : 'onb'; return h ? [id, h.a === 'fout' ? 'nee' : h.a, h.b === 'fout' ? 'nee' : h.b] : [id, fo, fo]; });\n      const extraNames = Object.assign({}, this.state.extraNames);\n      extraValid.forEach(e => { if (!names[e.id]) extraNames[e.id] = e.nm || 'Onderneming ' + fmt(e.id); });\n      const nl = { id: 'n' + Date.now(), d: TODAY + ' 16:50', t: this.state.name || namePh, by: 'Niels Lataire', items };\n      this.setState({ lists: [nl, ...lists], extraNames, sel: {}, extra: '', name: '', open: nl.id });\n      this.flash('Controlelijst bewaard');\n    };\n    const namePh = src === 'actief' ? `Actieve werven — ${TODAY}` : src === 'jaar' ? `Laatste 12 maanden — ${TODAY}` : `Controle — ${TODAY}`;\n\n    // ---- eerdere lijsten\n    const q = this.state.q.trim().toLowerCase(), qD = q.replace(/[^0-9]/g, '');\n    const hitId = id => (q && (names[id] || '').toLowerCase().includes(q)) || (qD.length >= 3 && id.includes(qD));\n    const tally = l => ({ pl: l.items.filter(([, a, b]) => a === 'ja' || b === 'ja').length, f: l.items.filter(([, a]) => a === 'fout').length });\n    const numCell = (v, k) => `display:inline-block;min-width:22px;text-align:center;font:600 12px ${F};font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:5px;${v ? `background:${P[k][0]};color:${P[k][1]}` : 'color:#5a6b58'}`;\n    const reuse = l => {\n      const n = {}; const ex = [];\n      l.items.forEach(([id]) => { if (byId[id]) n[id] = true; else ex.push(`${names[id] || ''}; ${fmt(id)}`); });\n      this.setState({ sel: n, extra: ex.join('\\n'), src: 'alle', werf: {}, sq: '', open: null, name: l.t.replace(/ \\(herhaling\\)$/, '') + ' (herhaling)' });\n      this.flash(`${l.items.length} aannemers geselecteerd uit “${l.t}”`);\n    };\n    const shown = lists.filter(l => !q || [l.t, l.by, l.d].some(s => s.toLowerCase().includes(q)) || l.items.some(([id]) => hitId(id)));\n    const listRows = shown.map(l => { const t = tally(l); const hits = q ? l.items.filter(([id]) => hitId(id)).map(([id]) => names[id]) : [];\n      return { d: l.d, t: l.t, by: l.by, n: l.items.length, pl: t.pl, plS: numCell(t.pl, 'plicht'), f: t.f, fS: numCell(t.f, 'fout'), hasHit: hits.length > 0, hit: hits.join(', '), open: () => this.setState({ open: l.id }), reuse: () => reuse(l) }; });\n\n    // ---- zijpaneel (57a) en voorbeeld (57b)\n    const refOf = (lid, id, n) => { let h = 0; const x = lid + id + n; for (let c = 0; c < x.length; c++) h = (h * 31 + x.charCodeAt(c)) >>> 0; return h; };\n    const mkPanel = (l, key, nm) => {\n      const nameOf = id => nm[id] || null;\n      const order = it => (it[1] === 'ja' || it[2] === 'ja') ? 0 : it[1] === 'fout' ? 1 : 2;\n      const items = l.items.slice().sort((x, y) => order(x) - order(y));\n      const cnt = { pl: items.filter(it => order(it) === 0).length, f: items.filter(it => order(it) === 1).length };\n      const cell = (v, pct, who) => v === 'ja' ? { s: chipS('plicht'), i: I.plicht, l: `Inhouden ${pct}`, sub: `storten aan ${who}` } : v === 'fout' ? { s: chipS('fout'), i: I.fout, l: 'Mislukt', sub: 'opnieuw proberen' } : v === 'onb' ? { s: chipS('onb'), i: I.onb, l: 'Niet gekend', sub: 'buitenlandse onderneming' } : { s: chipS('ok'), i: I.ok, l: 'Geen schulden', sub: '' };\n      const copy = (what) => () => this.flash(what + ' gekopieerd');\n      const rows = items.map(([id, a, b, ref, att]) => {\n        const n = nameOf(id), A = cell(a, '35 %', 'de RSZ'), B = cell(b, '15 %', 'de FOD Fin.');\n        const pl = a === 'ja' || b === 'ja';\n        const h = refOf(l.id, id, 1).toString(36).toUpperCase();\n        return { n: n || 'Naam onbekend', unknown: !n, nS: n ? `font:600 13.5px ${F};color:#2C3B2A` : `font:italic 500 13.5px ${F};color:#5a6b58`,\n          id: fmt(id), link: () => this.flash('Kies een leverancier om aan ' + fmt(id) + ' te koppelen'),\n          aS: A.s, aI: A.i, aL: A.l, aSub: A.sub, bS: B.s, bI: B.i, bL: B.l, bSub: B.sub,\n          ref: a === 'fout' ? '—' : ref || ('1Y201' + h.padStart(8, 'X').slice(-8)), att: a === 'fout' ? '—' : att || String(90000000 + refOf(l.id, id, 2) % 9999999),\n          refCopy: copy('Referentie'), attCopy: copy('Attest'),\n          card: `border-radius:10px;background:#fff;box-shadow:inset 0 0 0 ${pl ? '1.5px #D9A9A9' : '1px rgba(44,59,42,.12)'}` };\n      });\n      const plNames = items.filter(it => order(it) === 0).map(([id, a, b]) => `${nameOf(id) || fmt(id)}: ${[a === 'ja' ? '35 % aan de RSZ' : '', b === 'ja' ? '15 % aan de FOD Financiën' : ''].filter(Boolean).join(' en ')}`);\n      const box = (on, last) => `display:flex;flex-direction:column;gap:2px;padding:10px 14px;${last ? '' : 'border-right:1px solid rgba(44,59,42,.08);'}${on ? '' : ''}`;\n      const vs = (v, k) => `font:600 20px ${F};font-variant-numeric:tabular-nums;line-height:1.1;color:${v && k ? P[k][1] : '#2C3B2A'}`;\n      const unnamed = l.t === 'Zonder naam';\n      const menuOn = this.state.menu === key;\n      return {\n        t: unnamed ? `Controle van ${l.d}` : l.t, noName: unnamed, rename: () => this.flash('Typ een naam in de titel'),\n        meta: `${unnamed ? '' : l.d + ' · '}${l.by} · ${l.items.length} ondernemingen`,\n        kpi: [{ v: items.length - cnt.pl - cnt.f, l: 'zonder schulden', s: vs(0), box: box(0, 0) }, { v: cnt.pl, l: 'met inhoudingsplicht', s: vs(cnt.pl, 'plicht'), box: box(0, 0) }, { v: cnt.f, l: 'mislukt', s: vs(cnt.f, 'fout'), box: box(0, 1) }],\n        valid: l.d.slice(0, 10), hasPlicht: cnt.pl > 0,\n        alert: plNames.join(' · ') + ' — op het factuurbedrag excl. btw. De rest betaal je aan de aannemer.',\n        rows, trace: l.trace || ('fcf2f16a' + refOf(l.id, 'x', 3).toString(16).padStart(8, '0') + '98fdc501e').slice(0, 24),\n        traceCopy: () => { this.setState({ menu: null }); this.flash('Trace-ID gekopieerd'); },\n        json: () => { this.setState({ menu: null }); this.flash('Bewijs (JSON) gedownload'); },\n        menuOn, menuTog: () => this.setState({ menu: menuOn ? null : key }),\n        reuse: () => reuse(l), close: () => this.setState({ open: null, menu: null })\n      };\n    };\n    const ol = lists.find(l => l.id === this.state.open);\n    const pv = ol ? mkPanel(ol, 'pv', names) : mkPanel({ id: '-', d: '', t: '', by: '', items: [] }, 'pv', names);\n    const sample = { id: 's1', d: '09/11/2026 17:21', t: 'Zonder naam', by: 'niels.lataire@groupln.be', trace: 'fcf2f16a6b218a798fdc501e',\n      items: [['BE0433984532', 'nee', 'nee', '1Y201JXG7VL2Z', '99038389'], ['BE0657812725', 'nee', 'nee', '1Y201JXZ7K5DZ', '99030657'], ['BE0663024001', 'ja', 'ja', '1Y201JXZ7K4CZ', '95397938']] };\n    const sv = mkPanel(sample, 'sv', { BE0433984532: 'Bouw & Beton Driessens', BE0657812725: 'Dakwerken Demeyer' });\n    sv.reuse = () => this.flash('3 ondernemingen opnieuw geselecteerd');\n    sv.close = () => {};\n\n    const cantRun = total === 0;\n    return {\n      rail, sources, isActief: src === 'actief', isJaar: src === 'jaar', werfChips,\n      sq: this.state.sq, onSq: e => this.setState({ sq: e.target.value }),\n      rows, noRows: rows.length === 0, allOn, toggleAll,\n      extra: this.state.extra, onExtra: e => this.setState({ extra: e.target.value }),\n      name: this.state.name, namePh, onName: e => this.setState({ name: e.target.value }),\n      total, selCount: selIds.length, selList, hasSel: selIds.length > 0, clearSel: () => this.setState({ sel: {}, extra: extraOnly.map(e => (e.nm ? e.nm + '; ' : '') + e.raw).join('\\n') }),\n      hasExtra: extraOnly.length > 0, extraCount: extraValid.length, extraList, empty: total === 0 && !extraOnly.length,\n      hasPlichtSel: plichtSel > 0, plichtNote: `${plichtSel} ${plichtSel === 1 ? 'aannemer had' : 'aannemers hadden'} bij de vorige controle inhoudingsplicht.`,\n      skipNote: [extraMatched ? `${extraMatched} geplakt nummer${extraMatched > 1 ? 's' : ''} aangevinkt` : '', bad ? `${bad} ongeldig` : ''].filter(Boolean).join(' · '),\n      run, cantRun, runLabel: total ? `Controleer en bewaar (${total})` : 'Controleer en bewaar',\n      runStyle: `height:36px;padding:0 16px;border-radius:8px;border:0;display:inline-flex;align-items:center;gap:8px;font:600 13px ${F};color:#fff;background:${cantRun ? '#7a8a78' : G};cursor:${cantRun ? 'default' : 'pointer'}`,\n      histCount: lists.length, q: this.state.q, onQ: e => this.setState({ q: e.target.value }), listRows, noLists: listRows.length === 0,\n      panelOpen: !!ol, pv, sv,\n      hasToast: !!this.state.toast, toast: this.state.toast\n    };\n  }\n\n  dropExtra(id, norm) {\n    const keep = String(this.state.extra).split('\\n').map(line => {\n      if (line.includes(';') || line.includes('\\t')) { const p = line.split(/[;\\t]/); return norm(p.slice(1).join(' ')).id === id ? null : line; }\n      const parts = line.split(',').filter(x => norm(x).id !== id);\n      return parts.length ? parts.join(',') : (line.trim() ? null : line);\n    }).filter(l => l !== null);\n    this.setState({ extra: keep.join('\\n') });\n  }\n  flash(msg) { clearTimeout(this._t); this.setState({ toast: msg }); this._t = setTimeout(() => this.setState({ toast: '' }), 2600); }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
