<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00532D">
<title>Geen verbinding · CPM</title>
<style>
  html,body{margin:0;height:100%;background:#F2F5EF;color:#2C3B2A;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  main{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:20px;margin:8px 0 0}
  p{margin:0;color:#5a6b58;font-size:16px;line-height:1.5;max-width:320px}
  button{margin-top:12px;min-height:48px;padding:0 24px;border:0;border-radius:10px;background:#00532D;color:#fff;font-size:16px;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Geen verbinding</h1>
  <p>De pagina kon niet geladen worden. Controleer je internetverbinding en probeer opnieuw.</p>
  <button type="button" onclick="location.reload()">Probeer opnieuw</button>
</main>
</body>
</html>
